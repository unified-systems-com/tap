# SonarCloud analysis configuration — committed, not UI state.
#
# THE FILENAME IS THE CONFIGURATION. SonarCloud reads two different files:
#
#   sonar-project.properties  — CI-based analysis (a scanner step in a workflow)
#   .sonarcloud.properties    — Automatic Analysis (SonarCloud reads the repo itself)
#
# Every TAP project uses Automatic Analysis, so a file named
# `sonar-project.properties` is INERT — it reads as configured and is not. Proven
# empirically on tap-plugin-github-core (PR #4 vs PR #6: same content, same file,
# 80.5% -> 0.0% duplication; the only variable was the name). Never rename this file.
#
# Rationale for every line lives here rather than in a dashboard click, for the same
# reason .codacy.yaml exists: a UI resolution is invisible to review, unreviewable in
# a PR, and gone if the project is ever recreated. One path for every maintainer.
#
# Dispositions below were set during the #123 Sonar backlog triage (2026-08-31).


# --- Duplication: generated Django migrations (unified-systems-com/tap#201) -----------
#
# django-simple-history emits every model's field list TWICE in one migration — once
# for the model, once for its `historical` twin. That is the GENERATOR repeating
# itself; it cannot be refactored away without hand-editing generated output, and it
# recurs with every migration any TAP project ever adds. Core's exposure at triage
# time: 77.6% (tap_cares), 75.4% (tap_viz), 69.8% (tap_plugins validation fixture),
# 58.2% (tap_web), 45.0% (tap_grid) — each one a 3%-new-code-ceiling gate failure
# waiting for the first PR that touches a migration, for a reason having nothing to
# do with that PR's change.
#
# Scoped to DUPLICATION ONLY — deliberately not sonar.exclusions — so migrations keep
# bug, vulnerability and smell analysis. A real defect in a migration is still a
# defect; only the duplication signal is meaningless there.
sonar.cpd.exclusions=**/migrations/**


# --- Scope: spikes/ is a record of settled experiments, not shipping code ------------
#
# spikes/distroless/ and spikes/fips/ are the working notes of two explorations that
# have since been decided and written up as canon (specs/spec-fips.md,
# doc-fips-assessment-record.md). They are not built, not shipped, and untouched since
# 2026-07-09. They accounted for 14 of the 79 open vulnerabilities at triage time —
# every one an observation about a Dockerfile nobody deploys (root default user,
# unpinned pip installs, http:// fetches in a throwaway build stage).
#
# Analyzing them buys a permanently red security axis for code with no runtime. Git
# history keeps the experiments either way. If a spike is ever promoted to a shipping
# path it leaves this directory, and analysis picks it up on the way out.
sonar.exclusions=spikes/**


# --- python:S3776 cognitive complexity: tap_grid/gryphon/executor.py -----------------
#
# The Gryphon executor is a known complex hairball we are consciously living with: it
# lowers a query AST to SQL, and the branching IS the language's surface area. 16 of
# its functions exceed the threshold; the worst is 53. Refactoring it is real work
# that needs someone holding the whole query language in their head, and doing it
# badly is worse than not doing it — so it is tracked as its own piece of work
# (unified-systems-com/tap#245) rather than left as 16 lines of dashboard noise that
# nobody will ever action.
#
# This is an exemption for ONE rule in ONE file. Every other rule still analyzes the
# executor, and every other file still reports S3776.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=tap_grid/gryphon/executor.py


# --- S8541 "--no-build" / "--only-binary :all:" -------------------------------------
#
# The rule wants pip/uv told never to build from source, so a hostile sdist's setup.py
# cannot execute during install. TAP cannot comply, and the reason is the FIPS posture:
# `cryptography` is `no-binary-package` in pyproject.toml and psycopg is `[c]`, because a
# wheel ships its OWN bundled OpenSSL that ignores OPENSSL_CONF and would silently run
# non-validated crypto (specs/spec-fips.md). Building those against the system module IS
# the control. `--no-build` would break the invariant the image exists to hold.
#
# In docker/entrypoint.sh the rule is additionally misfiring: four of its five hits are
# `uv run python manage.py ...` (createcachetable, migrate, steady_queue, tap.fips) —
# command execution, not dependency installation, and no install flag applies to them.
# Only the `uv sync` at the top is an install at all.
#
# The residual risk is real and named rather than waved away: TAP executes build backends
# for a small, pinned set of source-built packages. It is bounded by the uv lockfile
# (exact versions + hashes) and by the build-backend floors in pyproject.toml.
sonar.issue.ignore.multicriteria.e2.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.e2.resourceKey=docker/entrypoint.sh
sonar.issue.ignore.multicriteria.e3.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.e3.resourceKey=Dockerfile


# --- githubactions:S8264 "move read permission to job level" -------------------------
#
# Complying would VIOLATE TAP's own enforced requirement. req-cicd-runner-least-privilege-2
# (guarded by tap/guards/workflow_least_privilege.py) pins the opposite structure: every
# workflow declares a top-level `permissions:` block, top-level grants are READ-ONLY, and
# write scopes appear only at job level. A workflow-level `contents: read` is the deliberate
# read-only floor under every job, not a privilege that leaked upward — and it is what makes
# CodeQL's missing-workflow-permissions check pass.
#
# Sonar reads a top-level grant as over-broad without distinguishing read from write. Here
# the guard is stricter than the rule: it fails any job lacking an explicit least-privilege
# block, which S8264 does not check at all.
sonar.issue.ignore.multicriteria.e4.ruleKey=githubactions:S8264
sonar.issue.ignore.multicriteria.e4.resourceKey=.github/workflows/**


# --- shell:S5332 clear-text protocol in scripts/spawn-session.sh ----------------------
#
# The flagged URL is the http://localhost:<port> address a spawned dev session prints so the
# developer can open their own stack. It never leaves the host: TLS on a loopback URL that
# the script itself emits for a human to click would add a certificate to manage and protect
# a hop that has no network. TAP's real transport posture is enforced where traffic actually
# travels (req-cicd-runner-least-privilege, the --proto '=https' fetch pins in Dockerfile
# and docker/install-tailwindcss.sh).
sonar.issue.ignore.multicriteria.e5.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e5.resourceKey=scripts/spawn-session.sh


# --- NOT CONFIGURABLE HERE, recorded so the decision is not lost --------------------
#
# python:S3776's threshold is a rule PARAMETER, which lives in the quality profile —
# a SonarCloud UI setting with no committed representation. TAP raises it from
# Sonar's default 15 to 25, deliberately and permanently:
#
#   Of 108 findings at triage, 53 sat at 16-20 and the median was 21 — a band where
#   the rule flags competent, readable functions and drowns out the ones that matter.
#   At 25 the list falls to 26 findings, and those 26 are genuinely worth reading:
#   tap_grid/grift/importer.py alone holds 234, 114, 71 and 51.
#
# Restoring it, if the profile is ever reset or rebuilt:
#
#   1. https://sonarcloud.io/organizations/unified-systems-com/quality_profiles
#   2. Find python:S3776 IN THE PYTHON PROFILE. Read that twice. The languages are
#      listed alphabetically, so ABAP is first, its profile is ALSO called "Sonar way
#      essentials", and abap:S3776 has the identical rule name with threshold=60 —
#      the only rule in the whole org carrying a 60. Landing there and reading its
#      threshold as ours is the obvious mistake, and nothing in the UI corrects it
#      because this repo has no ABAP. Direct link to the right one:
#      https://sonarcloud.io/organizations/unified-systems-com/rules?qprofile=AaAwWBum5MixT0V1RmPT&activation=true&rule_key=python:S3776
#   3. "Sonar way essentials" is BUILT-IN and cannot be edited. EXTEND it (do not
#      Copy) so Sonar way's rule updates keep flowing and only this override
#      diverges; a Copy forks permanently and goes stale in silence.
#   4. Set threshold = 25 in the extended profile, then ASSIGN it to the project
#      (https://sonarcloud.io/project/quality_profiles?id=unified-systems-com_tap).
#      Until step 4, the new profile exists and analyzes nothing.
#
# A Python profile sitting at 15 is a misconfiguration, not a stricter standard.
