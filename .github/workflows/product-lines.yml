# Per-product-line CI lanes (spec-dev-validation.md req-dev-validation-product-line-lanes).
#
# Each product line is a boot profile validated on its own free GitHub-hosted runner
# (ubuntu-latest, 4 vCPU). The lane boots that line's profile, clones a per-profile
# pre-migrated template DB (fast + race-free setup, see TAP_TEST_DB_TEMPLATE /
# scripts/build-test-template), and runs that line's tests. Lines run in parallel;
# parallelism is along the meaningful product axis, not arbitrary shards.
#
# RUNNER HISTORY: lanes ran on per-line AWS CodeBuild runners (8 vCPU,
# ci/terraform/codebuild-runners/) until the measured free-runner spike showed the
# identical job at ~9 min vs ~7 min on CodeBuild — under the consolidation threshold,
# so CodeBuild was retired (runs 31443692421/31444605018/31444606509 hold the
# measurements). The Terraform + account 180731181784 teardown is tracked separately
# (account retirement is deliberately LAST in the migration plan). Adding a line is
# now just a matrix entry here.
#
# PROMOTE GATE: the `test_all` union lane here is the promote gate — promote-to-main.sh
# Step 2.6 dispatches `line=test_all` and blocks the atomic push on red (option B,
# req-dev-validation-product-line-lanes-6). The sharded all-plugins.yml lane is
# retained as the fallback (TAP_PROMOTE_CI_WORKFLOW=all-plugins.yml).

name: product-lines

on:
  workflow_dispatch:
    inputs:
      line:
        description: "Lane to run on dispatch. 'all' runs every lane; a single lane runs just that one. PR events always run all lanes."
        type: choice
        options: [test_all, samsite, all]
        default: test_all
  # merge_group: the gate must also run when a merge queue tests a PR against
  # projected main (req-cicd-branch-protection PR-flow endgame). Harmless until the
  # queue is enabled.
  merge_group:
  pull_request:
    branches: [main]

# Explicit least-privilege GITHUB_TOKEN (org default is read-only; stated here so the
# file is self-describing and CodeQL's missing-workflow-permissions check passes).
permissions:
  contents: read

concurrency:
  group: product-lines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pick the lane set. On dispatch, run only the selected lane (default test_all); a
  # 'line=all' dispatch and every PR run all lanes. The matrix context is not available
  # in a job-level if, so we compute the matrix here and feed it in via fromJSON.
  # NOTE: since 2026-08-08 every plugin repo is PUBLIC on unified-systems-com, so both
  # lanes git-install anonymously — no credential, no Secrets Manager round-trip. The
  # plugin-pull machinery (routing manifest + provider preinstall + ambient-creds export,
  # driven by a needs_plugin_pull matrix flag) was removed here the same day; a fork that
  # installs PRIVATE plugins wants it back — see req-tap-plugin-arch-source-secret-5 and this
  # file's git history at a73c62b9 for the worked example.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      # Validation tier of this diff vs origin/main (scripts/change-tier —
      # req-dev-validation-product-line-lanes-7): docs | specs | full. Jobs gate
      # on it; the `gate` aggregator accepts a skip ONLY when the tier justifies
      # it. Fail-closed: empty/unknown diffs are `full` (so a dispatch on a ref
      # equal to main runs everything — "prove the world green" stays honest).
      tier: ${{ steps.pick.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # change-tier walks back to the merge-base with origin/main.
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          LINE: ${{ github.event.inputs.line }}
        run: |
          git fetch origin main --quiet || true
          tier="$(scripts/change-tier origin/main)"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "change tier: $tier"
          test_all='{"line":"test_all","profile":"test_all"}'
          samsite='{"line":"samsite","profile":"samsite"}'
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$LINE" != "all" ]; then
            case "$LINE" in
              test_all) inc="$test_all" ;;
              samsite)  inc="$samsite" ;;
              *) echo "::error::unknown line '$LINE'"; exit 1 ;;
            esac
          else
            inc="$test_all,$samsite"
          fi
          # specs tier: every spec-consuming test (Map sync, RID resolution) lives
          # in the test_all union suite; the samsite lane adds no spec coverage.
          # docs tier skips `line` entirely via its job-level if.
          if [ "$tier" = "specs" ]; then inc="$test_all"; fi
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"

  # Broad credential scan — the complement to the in-repo `secret-pattern` guard
  # (req-tap-cares-secrets-credential-patterns). The guard is exact and always-on over six
  # shapes; this covers the ~100 provider patterns it does not. Empirically NOT redundant:
  # on 2026-07-22 gitleaks caught a planted Stripe token the guard has no pattern for, and
  # MISSED a planted AWS access key id the guard catches. Both layers, or neither is honest.
  #
  # Runs the GATE profile (.gitleaks.toml — entropy rules off; see that file for the 21
  # findings / 21 false positives measurement that justifies it). The full ruleset belongs
  # to the human-triaged pre-publication history audit (req-tap-cares-secrets-history-audit),
  # not here.
  #
  # Installed from the GitHub release rather than the Docker Hub image, deliberately:
  # anonymous Docker Hub pulls chronically 429'd and redded this gate
  # (req-cicd-base-image-sourcing). The release tarball comes from the same host the runner
  # already talks to. Version pinned — an auto-updating scanner is an unreviewed change to
  # what "green" means.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The gate scans the tree, not history — but a shallow clone also breaks the
          # `git`-mode fallback, so keep full history available for manual re-runs.
          fetch-depth: 0
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree (gate profile)
        run: |
          # --redact so a true positive is not re-disclosed in a public CI log.
          gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

  # DCO sign-off trailer check (req-cicd-dco-signoff): every non-merge, non-bot
  # commit this ref adds over origin/main carries `Signed-off-by` (CONTRIBUTING
  # "Sign-Off"). ENFORCING since 2026-08-12 — CONTRIBUTING.md + DCO are repo policy,
  # so a missing trailer FAILS this job (the enforcing default lives in check-dco
  # itself; no env var here, so CI and an ad-hoc run agree). Covers the
  # PR road and the promote's dispatched cloud gate (the _ci-gate throwaway ref) in
  # one place; deliberately NOT in `line`'s needs — an unsigned commit is a trailer
  # problem, not a code problem, so it reds the run without blocking the test lanes.
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The check walks commits back to the merge-base with origin/main.
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        run: |
          git fetch origin main --quiet
          scripts/check-dco origin/main

  # Referenced-RID integrity (req-docs-rid-integrity-2). Deliberately NOT tier-gated: the
  # docs tier skips every pytest lane, so the `rid-reference-integrity` guard does not run
  # there — and a brand-new doc citing a typo'd RID is exactly a docs-tier change. The scan
  # is stdlib-only and grep-speed, so it costs the ~1-minute docs tier almost nothing.
  # Same artifact the guard calls (scripts/check-rids → tap/spec_trace).
  rids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # tap/spec_trace + tap/source_scan are py3.14 code (PEP 758 bare multi-except —
      # black's py314 target actively rewrites the parenthesized form back, so
      # down-leveling the source is not an option). The runner's system python is
      # older; give this stdlib-only scan the interpreter the codebase is written for.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Derived, never authored twice: resolve the interpreter from the same
          # requires-python that governs the container build (pyproject.toml), so the
          # runner can never drift from the container again.
          python-version-file: "pyproject.toml"
      - name: Check referenced RIDs resolve
        run: scripts/check-rids

  line:
    # secret-scan gates the expensive lanes: it is ~30s, the lanes are ~9min,
    # and there is no value in testing a tree that is leaking a credential.
    # Tier-gated (req-dev-validation-product-line-lanes-7): a docs-tier diff (inert
    # documentation only) cannot red pytest — skip; the gate aggregator accepts the
    # skip only when the tier justifies it. specs-tier runs test_all only (see setup).
    if: needs.setup.outputs.tier != 'docs'
    needs: [setup, secret-scan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    # Free GitHub-hosted runner (4 vCPU) — measured at ~9 min for the identical job
    # vs ~7 min on the retired 8-vCPU CodeBuild runner (see header RUNNER HISTORY).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      # Name of the per-worker clone-source template built below (in-container).
      TAP_TEST_DB_TEMPLATE: tap_test_template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Provide empty secrets root
        run: |
          rm -f tap_secrets
          mkdir -p tap_secrets

      - name: Point the uv cache at an out-of-tree dir (runner temp)
        # $RUNNER_TEMP is outside the workspace, so the container's `.:/app` mount
        # never sweeps the persisted cache into the scanned repo tree (the
        # secret-pattern guard walks /app). Set via $GITHUB_ENV in a run step, NOT a
        # job-level `env:` — the `runner` context is unavailable at job level, and
        # referencing it there is an invalid-workflow error (no jobs even schedule).
        run: echo "TAP_CI_UV_CACHE=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"

      - name: Provide web image (pull published when inputs unchanged, else build)
        uses: ./.github/actions/ci-web-image

      # The samsite record ships inside tap-plugin-samsite (req-boot-bootstrap-samsite-rehome);
      # the lane fetches it by the same pointer operators use — one copy, no lane-local fork
      # (rehome-5). Staged into boot/ it is thereafter an ordinary local profile. Lane is
      # deprecation-slated with the 180731181784 retirement; keep this minimal.
      - name: Restore uv cache (wheels + plugin git-installs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-ci-${{ matrix.profile }}-${{ hashFiles('uv.lock', 'boot/*.boot.json') }}
          restore-keys: |
            uv-ci-${{ matrix.profile }}-
            uv-ci-
      - name: Stage the samsite record (bootstrap pointer)
        if: matrix.line == 'samsite'
        run: |
          python3 -m tap.boot_pointer \
            'git+https://github.com/unified-systems-com/tap-plugin-samsite@v0.2.0#samsite' \
            --out boot

      # Boot THIS line's profile (preboot installs exactly that profile's plugins).
      - name: Boot the ${{ matrix.profile }} profile
        env:
          TAP_BOOT_PROFILE: ${{ matrix.profile }}
          TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE: "false"
        run: |
          docker compose --env-file .env up -d
          ok=0
          for i in $(seq 1 300); do
            if docker compose --env-file .env logs web 2>/dev/null | grep -q 'TAP-ABORT:'; then
              echo "::error::boot aborted (TAP-ABORT sentinel in web log)"
              docker compose --env-file .env logs web; exit 1
            fi
            if docker compose --env-file .env exec -T web sh -c 'cd /app && uv run python manage.py health --set readiness' >/dev/null 2>&1; then
              echo "web healthy after ~$((i * 3))s"; ok=1; break
            fi
            # 3s, not 10: readiness lands mid-interval, so the poll step is pure
            # quantization waste — same total timeout via the higher loop bound.
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "::error::web did not become healthy within the timeout"
            docker compose --env-file .env logs web | tail -150; exit 1
          fi

      # Cold-resolve the staged samsite record against the stack it just booted:
      # schema + the required_secrets coherence rules + every seed slug/bundle and
      # collector key checked against the live registries — offline, secrets-free,
      # zero mutation (`boot --check`). This is the CORE-side half of the record-gate
      # seam (req-boot-bootstrap-samsite-rehome-4): the record's own shipped suite
      # runs in the plugin repo's CI on its cadence; this step catches the other
      # direction — a core/plugin-registry change that rots the record — on tap's
      # cadence. Population still never runs here (no collectors, empty secrets).
      - name: Cold-resolve the samsite record (boot --check)
        if: matrix.line == 'samsite'
        run: |
          docker compose --env-file .env exec -T web sh -c \
            'cd /app && uv run python manage.py boot --profile samsite --check'

      # Build the per-profile template DB workers clone from. Honors the booted profile's
      # installed app set (entry-point discovery), so the template schema matches the run.
      - name: Build per-profile test-DB template
        run: docker compose --env-file .env exec -T web sh -c 'cd /app && TAP_TEST_DB_TEMPLATE=tap_test_template scripts/build-test-template'

      # This line's tests. install-aware collection (req-dev-validation-collection-complete)
      # runs core + the booted profile's plugin tests. Worker DBs clone the template.
      - name: Test lane — ${{ matrix.line }}
        # -n auto: workers == cores. Measured on the 4-vCPU free runner (tmpfs pg,
        # so the lane is CPU-bound): -n 4 = 233s, -n 6 = 243s, -n 8 = 256s — and
        # auto keeps tracking the runner size if GitHub resizes it again.
        run: docker compose --env-file .env exec -T web sh -c 'cd /app && TAP_TEST_DB_TEMPLATE=tap_test_template uv run pytest -n auto'

      - name: Dump web logs on failure
        if: failure()
        run: docker compose --env-file .env logs web | tail -200
      - name: Make uv cache saveable (container wrote it as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/uv-cache" 2>/dev/null || true

  # CI boot gates (req-dev-validation-smoke-gate / req-dev-validation-lean-boot).
  # The SAME scripts/gate + scripts/gate-lean artifacts the local promote runs —
  # "one artifact, many invokers" was scripts/gate's design contract from day one;
  # the published-images wave (pull, not build) is what made server-side invocation
  # cheap enough to take (2026-08-10). These jobs are REQUIRED via the gate
  # aggregator: with them, no validation authority exists only on a laptop.
  cold-boot:
    # Tier-gated (req-dev-validation-product-line-lanes-7): markdown cannot affect
    # boot — docs/specs-tier diffs skip both boot gates; the gate aggregator
    # accepts the skip only when the tier justifies it.
    if: needs.setup.outputs.tier == 'full'
    needs: [setup, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      TAP_BOOT_PROFILE: test_all
      TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Provide empty secrets root
        run: |
          rm -f tap_secrets
          mkdir -p tap_secrets
      - name: Point the uv cache at an out-of-tree dir (runner temp)
        # See the `line` job: $RUNNER_TEMP is outside the workspace (out of the
        # scanned /app tree); set via $GITHUB_ENV, not job-level `env:`, because the
        # `runner` context is unavailable at job level.
        run: echo "TAP_CI_UV_CACHE=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
      - name: Provide web image (pull published when inputs unchanged, else build)
        uses: ./.github/actions/ci-web-image
      - name: Restore uv cache (wheels + plugin git-installs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-ci-test_all-${{ hashFiles('uv.lock', 'boot/*.boot.json') }}
          restore-keys: |
            uv-ci-test_all-
            uv-ci-
      - name: Boot the test_all profile
        run: |
          docker compose --env-file .env up -d
          ok=0
          for i in $(seq 1 300); do
            if docker compose --env-file .env logs web 2>/dev/null | grep -q 'TAP-ABORT:'; then
              echo "::error::boot aborted (TAP-ABORT sentinel in web log)"
              docker compose --env-file .env logs web; exit 1
            fi
            if docker compose --env-file .env exec -T web sh -c 'cd /app && uv run python manage.py health --set readiness' >/dev/null 2>&1; then
              echo "web healthy after ~$((i * 3))s"; ok=1; break
            fi
            # 3s, not 10: readiness lands mid-interval, so the poll step is pure
            # quantization waste — same total timeout via the higher loop bound.
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "::error::web did not become healthy within the timeout"
            docker compose --env-file .env logs web | tail -150; exit 1
          fi
      - name: Cold-boot gate (scripts/gate — fresh scratch-DB boot cycle)
        run: scripts/gate
      - name: Dump web logs on failure
        if: failure()
        run: docker compose --env-file .env logs web | tail -200
      - name: Make uv cache saveable (container wrote it as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/uv-cache" 2>/dev/null || true

  lean-boot:
    # Tier-gated: markdown cannot affect boot (see cold-boot).
    if: needs.setup.outputs.tier == 'full'
    needs: [setup, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain (lsof for the spawn port probe)
        run: command -v lsof >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q lsof)
      - name: Lean-boot independence gate (scripts/gate-lean)
        env:
          TAP_DEV_ADMIN_PASSWORD: ci-throwaway
        run: scripts/gate-lean

  # REQUIRED gate: the api-fuzz reusable workflow (.github/workflows/api-fuzz.yml)
  # in DETERMINISTIC posture — pinned seed, small example budget, findings FAIL. The
  # verdict is a function of the code, not the day's random draw, so a promote is never
  # blocked by a fresh example finding a latent bug on unrelated code. That broad
  # exploration runs nightly instead (api-fuzz-nightly.yml, random seed, non-blocking).
  # Tier-gated like the boot gates: markdown cannot change the API surface.
  api-fuzz:
    if: needs.setup.outputs.tier == 'full'
    needs: [setup, secret-scan]
    uses: ./.github/workflows/api-fuzz.yml
    with:
      seed: "20260811"
      max_examples: 20
      fail_on_findings: true

  # The single stable required-check target — rulesets point ONLY at this name.
  # The matrix names its `line` instances from matrix DATA ("line (test_all, ...)"),
  # so those names silently change whenever the matrix shape changes; requiring them
  # directly leaves the ruleset pinned to strings that stop reporting. This job has a
  # hand-chosen name and one opinion. `if: always()` means it cannot be skipped into
  # a false green (GitHub treats a skipped required check as satisfied — fail-open);
  # it demands `success` specifically, so skipped/cancelled upstream jobs FAIL the
  # gate. Sibling of all-plugins.yml's `all-plugins-gate`, same convention.
  gate:
    needs: [setup, secret-scan, rids, line, cold-boot, lean-boot, api-fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A skip is acceptable ONLY where the change tier justifies it
      # (req-dev-validation-product-line-lanes-7): docs-tier may skip the lanes,
      # docs/specs-tier may skip the boot gates. Everything else — including a
      # skip with an empty/failed setup, a cancelled job, or a skip the tier does
      # not explain — fails. setup and secret-scan are unconditionally required
      # (docs leak credentials too, and the tier itself comes from setup).
      - name: Required jobs succeeded, or skipped only where the tier permits
        env:
          TIER: ${{ needs.setup.outputs.tier }}
          R_SETUP: ${{ needs.setup.result }}
          R_SECRET: ${{ needs.secret-scan.result }}
          R_RIDS: ${{ needs.rids.result }}
          R_LINE: ${{ needs.line.result }}
          R_COLD: ${{ needs.cold-boot.result }}
          R_LEAN: ${{ needs.lean-boot.result }}
          R_FUZZ: ${{ needs.api-fuzz.result }}
        run: |
          echo "tier=$TIER setup=$R_SETUP secret-scan=$R_SECRET rids=$R_RIDS line=$R_LINE cold-boot=$R_COLD lean-boot=$R_LEAN api-fuzz=$R_FUZZ"
          die() { echo "::error::$1"; exit 1; }
          [ "$R_SETUP" = "success" ] || die "setup finished '$R_SETUP'"
          [ "$R_SECRET" = "success" ] || die "secret-scan finished '$R_SECRET' (always required)"
          # rids is never tier-gated: a dangling RID citation is most likely in a docs-tier
          # change, which is exactly where the pytest guard does not run (req-docs-rid-integrity-2).
          [ "$R_RIDS" = "success" ] || die "rids finished '$R_RIDS' (always required)"
          case "$R_LINE" in
            success) : ;;
            skipped) [ "$TIER" = "docs" ] || die "line skipped without a docs-tier justification (tier='$TIER')" ;;
            *) die "line finished '$R_LINE'" ;;
          esac
          case "$R_COLD" in
            success) : ;;
            skipped) { [ "$TIER" = "docs" ] || [ "$TIER" = "specs" ]; } || die "cold-boot skipped on a full-tier diff" ;;
            *) die "cold-boot finished '$R_COLD'" ;;
          esac
          case "$R_LEAN" in
            success) : ;;
            skipped) { [ "$TIER" = "docs" ] || [ "$TIER" = "specs" ]; } || die "lean-boot skipped on a full-tier diff" ;;
            *) die "lean-boot finished '$R_LEAN'" ;;
          esac
          # api-fuzz runs only on the full tier (needs a live boot), same as the boot
          # gates — a skip is acceptable exactly where cold/lean-boot's is.
          case "$R_FUZZ" in
            success) : ;;
            skipped) { [ "$TIER" = "docs" ] || [ "$TIER" = "specs" ]; } || die "api-fuzz skipped on a full-tier diff" ;;
            *) die "api-fuzz finished '$R_FUZZ'" ;;
          esac
          echo "gate GREEN (tier: $TIER)"
