# Reusable API property-fuzz (req-dev-validation-api-fuzz). ONE source of the
# boot + throwaway-admin + session/CSRF mint + schemathesis two-pass logic, called
# in two postures so the gate and the nightly explorer never drift:
#
#   * product-lines.yml `api-fuzz` (REQUIRED gate): seed PINNED, max-examples small,
#     fail_on_findings=true — a deterministic regression check on the promote path.
#   * api-fuzz-nightly.yml (exploration): seed RANDOM (empty), max-examples deep,
#     fail_on_findings=false — hunts NEW bugs off the promote path, reports don't block.
#
# Both boot a dedicated `core_dev` stack (fast, secrets-free), fetch the live
# /api/v1/openapi.json (Django Ninja generates it), and run two passes with the same
# two checks: no input may 5xx, and every response must match its declared schema.
# Unauthenticated = the auth wall must reject, never crash. Authenticated = a throwaway
# admin minted through the real boot auth phase + a DB session + CSRF pair reaches BEHIND
# the wall; a 200-canary refuses to run if "authenticated" would silently mean fuzzing
# 401s. Design record: docs/misc/doc-api-fuzz-auth-design.md.
name: api-fuzz

on:
  workflow_call:
    inputs:
      seed:
        description: "schemathesis --seed. Empty => a random seed (nightly exploration); a fixed integer => deterministic (the required gate)."
        required: false
        type: string
        default: ""
      max_examples:
        description: "schemathesis --max-examples per operation. Small for the gate (fast), deep for the nightly explorer."
        required: false
        type: number
        default: 20
      fail_on_findings:
        description: "true => a finding fails the job (required gate). false => findings become a ::warning:: + artifact (report-only exploration lane)."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  api-fuzz:
    runs-on: ubuntu-latest
    # Generous ceiling: the gate (max-examples 20) finishes in ~5 min well under this;
    # the deep nightly explorer needs the headroom. A ceiling, not a wait.
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      TAP_BOOT_PROFILE: core_dev
      TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE: "false"
      # Fuzz posture, threaded from the caller via env (never interpolated into the
      # shell command — avoids injection even though callers are in-repo/trusted).
      FUZZ_SEED: ${{ inputs.seed }}
      FUZZ_MAX_EXAMPLES: ${{ inputs.max_examples }}
      FUZZ_FAIL: ${{ inputs.fail_on_findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Provide empty secrets root
        run: |
          rm -f tap_secrets
          mkdir -p tap_secrets
      - name: Point the uv cache at an out-of-tree dir (runner temp)
        # $RUNNER_TEMP is outside the workspace (out of the scanned /app tree); set via
        # $GITHUB_ENV, not job-level `env:`, because `runner` is unavailable at job level.
        run: echo "TAP_CI_UV_CACHE=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
      - name: Provide web image (pull published when inputs unchanged, else build)
        uses: ./.github/actions/ci-web-image
      - name: Restore uv cache (wheels + plugin git-installs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-ci-core_dev-${{ hashFiles('uv.lock', 'boot/*.boot.json') }}
          restore-keys: |
            uv-ci-core_dev-
            uv-ci-
      - name: Boot the core_dev profile
        run: |
          docker compose --env-file .env up -d
          ok=0
          for i in $(seq 1 200); do
            if docker compose --env-file .env logs web 2>/dev/null | grep -q 'TAP-ABORT:'; then
              echo "::error::boot aborted (TAP-ABORT sentinel)"; docker compose --env-file .env logs web; exit 1
            fi
            # `manage.py health` gates on readiness, including the critical `migrations`
            # probe (tap_health): the DB can be reachable while the entrypoint's migrate is
            # still applying migrations (createcachetable precedes migrate), and acting then
            # races the half-applied schema (the plugin-loading flake). The migrations probe
            # makes health red until migrate is fully applied, so this waits correctly.
            if docker compose --env-file .env exec -T web sh -c 'cd /app && uv run python manage.py health --set readiness' >/dev/null 2>&1; then
              echo "web healthy + migrations applied after ~$((i * 3))s"; ok=1; break
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "::error::web not healthy / migrations not applied in time"; docker compose --env-file .env logs web | tail -100; exit 1; }
      - name: Run boot with a throwaway admin (auth phase)
        # The entrypoint migrates + serves but never runs `manage.py boot`, so the stack
        # has ZERO users until this step. The DJANGO_SUPERUSER_* env path is the canonical
        # route spawn uses (ensure_initial_admin, req-boot-secrets: credentials never live
        # in boot profiles). The password is per-run garbage — never echoed, never persisted.
        run: |
          PW="ci-fuzz-$(openssl rand -hex 16)"
          docker compose --env-file .env exec -T \
            -e DJANGO_SUPERUSER_USERNAME=admin \
            -e DJANGO_SUPERUSER_PASSWORD="$PW" \
            -e DJANGO_SUPERUSER_EMAIL=admin@ci-fuzz.tap.localhost \
            web sh -c 'cd /app && uv run python manage.py boot --profile core_dev'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Schemathesis — unauthenticated surface
        run: |
          base="http://localhost:${WEB_PORT:-8000}"
          schema="$base/api/v1/openapi.json"
          # `manage.py health` probes the backends in-process, NOT the HTTP server — the
          # runserver may still be warming when health first goes green (connection-reset
          # observed 2026-08-10). Poll HTTP itself.
          ok=0
          for _ in $(seq 1 60); do
            curl -fsS "$schema" -o /dev/null 2>/dev/null && { ok=1; break; }
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "::error::could not fetch $schema after 3 min"
            docker compose --env-file .env logs web | tail -80
            exit 1
          fi
          # Version pinned (supply-chain). --seed present only when the caller pins one
          # (deterministic gate); empty => schemathesis draws a random seed (exploration).
          seed_args=(); [ -n "$FUZZ_SEED" ] && seed_args=(--seed "$FUZZ_SEED")
          set +e
          # --with pins schemathesis's floating validation engine. History: jsonschema-rs
          # 0.50.0 (2026-08-20 17:27Z) broke 4.24.3 under the SAME pinned tool + seed
          # (PR #91 red, zero repo changes); the maintainer (who ships BOTH packages)
          # adapted schemathesis 4.25.0 to the 0.50.x engine the same night — verified
          # locally 2026-08-21: 4.24.3+0.50.0 red (13 errors), 4.25.0+0.50.0 green, same
          # seed. The pin stays because 4.25.0's own bound (<0.51.0) still floats patch
          # versions: a pinned tool with floating transitives is not pinned.
          uvx --with jsonschema-rs==0.50.0 schemathesis@4.25.0 run "$schema" \
            --checks not_a_server_error,response_schema_conformance \
            --max-examples "$FUZZ_MAX_EXAMPLES" --workers 2 "${seed_args[@]}" 2>&1 | tee schemathesis.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            [ "$FUZZ_FAIL" = "true" ] && { echo "::error::unauthenticated fuzz found issues (required gate)"; exit "$rc"; }
            echo "::warning::unauthenticated fuzz found issues (exploration lane, report-only) — see the schemathesis-log artifact"
          fi
      - name: Schemathesis — authenticated surface
        # Auth carrier: a real DB session minted by the DEBUG-fail-closed
        # tap_web/skills/drive-browser/mint_session.py, plus the csrftoken cookie from the
        # login page — ninja's django_auth is APIKeyCookie(csrf=True), so without the CSRF
        # pair every write op collapses to 403 and the pass is authenticated in name only.
        # The canary makes that failure mode loud instead of silent.
        run: |
          base="http://localhost:${WEB_PORT:-8000}"
          schema="$base/api/v1/openapi.json"
          key="$(docker compose --env-file .env exec -T web sh -c 'cd /app && uv run python manage.py shell' \
            < tap_web/skills/drive-browser/mint_session.py | sed -n 's/^SESSIONKEY=//p')"
          [ -n "$key" ] || { echo "::error::session mint failed (no SESSIONKEY in shell output)"; exit 1; }
          echo "::add-mask::$key"
          tok="$(curl -fsS -c - -o /dev/null "$base/auth/passkey/login/" | awk '$6 == "csrftoken" { print $7 }')"
          [ -n "$tok" ] || { echo "::error::no csrftoken cookie from $base/auth/passkey/login/"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: sessionid=$key" "$base/api/v1/entities/")"
          if [ "$code" != "200" ]; then
            echo "::error::authenticated canary GET /api/v1/entities/ returned $code, not 200 — refusing to fuzz what would silently be the 401 surface"
            exit 1
          fi
          seed_args=(); [ -n "$FUZZ_SEED" ] && seed_args=(--seed "$FUZZ_SEED")
          set +e
          uvx --with jsonschema-rs==0.50.0 schemathesis@4.25.0 run "$schema" \
            --checks not_a_server_error,response_schema_conformance \
            --max-examples "$FUZZ_MAX_EXAMPLES" --workers 2 "${seed_args[@]}" \
            -H "Cookie: sessionid=$key; csrftoken=$tok" \
            -H "X-CSRFToken: $tok" 2>&1 | tee schemathesis-auth.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            [ "$FUZZ_FAIL" = "true" ] && { echo "::error::authenticated fuzz found issues (required gate)"; exit "$rc"; }
            echo "::warning::authenticated fuzz found issues (exploration lane, report-only) — see the schemathesis-log artifact"
          fi
      - name: Upload fuzz logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: schemathesis-log
          path: |
            schemathesis.log
            schemathesis-auth.log
          if-no-files-found: ignore
      - name: Make uv cache saveable (container wrote it as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/uv-cache" 2>/dev/null || true
