# Nightly Trivy sweep of the published images (req-cicd-security-scanning-4 /
# req-cicd-base-image-lifecycle-2).
#
# The publish-time scan (publish-images.yml `scan` job) covers what ships at ship
# time; this covers ROT — CVEs disclosed against an image that hasn't changed.
# Findings land as SARIF in code scanning (same per-image categories as the
# publish-time scan, so alerts dedupe rather than duplicate). Report-only by
# design: the response loop for a real finding is a Renovate digest-bump PR
# (Chainguard patches fast) through the test_all gate, then publish ships the
# patched image — not a red nightly blocking anything.
#
# Waivers: .trivyignore at the repo root; every entry carries a mandatory reason
# comment (operator-waives discipline, mirroring the FIPS waiver pattern).
name: trivy-nightly

on:
  schedule:
    - cron: "30 9 * * *"   # daily 09:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: trivy scan ${{ matrix.image }}:latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [tap-web, tap-db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7   # for .trivyignore
        with:
          persist-credentials: false  # never leave the job token readable in .git config
      # guard-allow: req-cicd-runner-least-privilege — scanner needs no token; this job's
      # only write scope is security-events, consumed by the first-party SARIF upload step.
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/unified-systems-com/${{ matrix.image }}:latest
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: "0"
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # ------------------------------------------------------------------------------------
  # The image scan above reads PACKAGE DATABASES (apk, the Python closure). The out-of-band
  # components in docker/*sbom-supplemental.json are by definition the things no package
  # manager installed — so that scan cannot see them, and the self-built OpenSSL FIPS
  # provider, the most compliance-significant binary we ship, was never in a scanner's
  # field of view (req-fips-pin-currency, tap#231).
  #
  # GRYPE, NOT TRIVY, AND THE REASON MATTERS: Trivy matches SBOM components on **purl in a
  # known ecosystem** and ignores `cpe` entirely — measured 2026-08-31, our declared document
  # came back "Not scanned" while a control carrying `pkg:pypi/uv` matched immediately. Grype
  # matches on CPE, and returns real findings against the same document. A self-compiled
  # tarball belongs to no package ecosystem, so CPE is the only identifier it can carry, which
  # makes Grype the only one of the two that can see it.
  declared:
    name: grype scan — declared out-of-band components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [tap-web, tap-db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false  # never leave the job token readable in .git config
      # guard-allow: req-cicd-runner-least-privilege — security-events:write is the minimum
      # for the first-party SARIF upload below.
      #
      # Stated accurately, because the wording on the job above overstates it: job-level
      # permissions apply to EVERY step, so that write scope is available to the third-party
      # scanner too, not only to the upload. What actually bounds it is the pinned action SHA
      # and `persist-credentials: false` on checkout — not the comment. The stronger form is a
      # two-job split (scan under contents:read, hand the SARIF over as an artifact, upload
      # from a first-party job); that applies equally to the Trivy job above, so it is tracked
      # separately rather than changed here. Raised by the Grok review seat on PR #261.
      #
      # The image is a KEY, not a path: declared_cdx.py maps it to the committed manifest and
      # names its own output, so no filesystem path is built from workflow input.
      - name: Build the declared-components document
        run: python3 scripts/sbom/declared_cdx.py --image "${{ matrix.image }}"
      - name: Scan declared components
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          sbom: declared-${{ matrix.image }}.cdx.json
          output-format: sarif
          # Report-only, matching the image lane. These are DECLARED components whose
          # relevance needs the provider triage (req-fips-pin-currency-7) before anyone
          # acts: most OpenSSL CVEs are in libcrypto/libssl code the FIPS provider does
          # not contain. Failing the nightly on them would teach us to ignore it.
          fail-build: false
          severity-cutoff: low
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-declared-${{ matrix.image }}
