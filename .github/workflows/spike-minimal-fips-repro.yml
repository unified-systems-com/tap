name: spike minimal fips repro

on:
  push:
    branches:
      - spike/minimal-standalone-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spike-minimal-fips-repro
    steps:
      - uses: actions/checkout@v4
      - name: Build (once)
        run: docker compose build
      - name: Run via docker compose 20x fresh (db running concurrently)
        run: |
          fail=0
          for i in $(seq 1 20); do
            echo "=== attempt $i ==="
            if ! docker compose up --abort-on-container-exit --exit-code-from web; then
              fail=$((fail+1))
            fi
            docker compose down -v
          done
          echo "=== $fail/20 attempts failed ==="
          if [ "$fail" -gt 0 ]; then exit 1; fi
