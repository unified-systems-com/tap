name: spike minimal fips repro

on:
  push:
    branches:
      - spike/minimal-standalone-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t fips-repro spike-minimal-fips-repro
      - name: Run (expected to fail on real x86_64 hardware)
        run: docker run --rm fips-repro
