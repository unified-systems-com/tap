name: spike minimal fips repro

on:
  push:
    branches:
      - spike/minimal-standalone-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t fips-repro spike-minimal-fips-repro
      - name: Run 20x fresh (in case this is intermittent, not deterministic)
        run: |
          fail=0
          for i in $(seq 1 20); do
            echo "=== attempt $i ==="
            if ! docker run --rm fips-repro; then
              fail=$((fail+1))
            fi
          done
          echo "=== $fail/20 attempts failed ==="
          if [ "$fail" -gt 0 ]; then exit 1; fi
