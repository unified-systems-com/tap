# Unified AI Review shim — stage 2 (PRIVILEGED review).
# Spec: specs/spec-cicd-ai-review.md (req-cicd-ai-review-ensemble-5/-6, -harness-repo-3,
# -untrusted-content-7). Runs the base-branch definition in base-repo context with the
# vendor keys; the machinery it calls never checks out or executes PR content — the diff
# arrives as data. Machinery AND prompts pinned by full commit SHA (both pins are
# reviewer configuration: editing this file is a finding in its own right).
name: AI review

on:
  workflow_run:
    workflows: ["AI review capture"]
    types: [completed]

concurrency:
  group: ai-review-run-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: unified-systems-com/unified-ai-review/.github/workflows/review.yml@83c0d1dd3c8221c95ebf4707a0b0cf4a26ecf08f # main 2026-08-20
    with:
      prompts-repo: unified-systems-com/unified-ai-review-prompts
      prompts-ref: fcdba2b1ce8ebfb3ced0b30668da17d58cefb240 # main 2026-08-20 — security pack v1
      prompt-pack: security
      # gpt-5.5-long-context rides a 60k-TPM shared pool vs plain gpt-5.5's 10k —
      # first-light on PR #94 hit the 10k ceiling with a 271k-token promote diff.
      openai-model: gpt-5.5-long-context
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
