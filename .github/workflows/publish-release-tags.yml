# Versioned image tags — promote the same bytes (req-cicd-product-releases-1 +
# req-cicd-build-once-artifact's promote discipline, spec-cicd-hardening.md).
#
# On a vX.Y.Z tag push (created by the release-please lane), this does NOT
# rebuild anything: it retags the already-published, already-SLSA-attested
# multi-arch manifest for the tagged commit (`:sha-<short>`, minted by
# publish-images.yml on the main push that landed the release PR) as
# `:X.Y.Z`. Same digest, so the existing provenance attestation still
# verifies against the versioned tag:
#   gh attestation verify oci://ghcr.io/unified-systems-com/tap-web:X.Y.Z --owner unified-systems-com
#
# The poll loop exists because the tag usually arrives while publish-images is
# still building that same commit (~30 min worst case). Release-commit builds
# run in an isolated concurrency group (publish-images.yml, matched by
# contains() on the merge-commit BODY — see the comment there) precisely so a
# later main push cannot cancel them out from under this promotion (the
# v0.1.2 gap; recurred as v0.1.3 when the match was startsWith).
# If the loop still times out, backfill: dispatch publish-images
# with ref=<the tagged commit's full SHA> — it builds THAT commit and
# publishes its :sha-<short> without moving :latest — then re-run this
# workflow.

name: publish-release-tags

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish-release-tags-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: unified-systems-com

jobs:
  retag:
    name: retag ${{ matrix.image }} as ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [tap-web, tap-db]
    steps:
      # Read-only clone for the tag→commit deref; the job's only write path is
      # the registry, so the git token has no business persisting on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # guard-allow: req-cicd-runner-least-privilege — the registry login IS this
      # job's write path (manifest retag); nothing else third-party shares the job.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag the attested sha manifest as the release version
        run: |
          set -euo pipefail
          # Deref annotated tags explicitly — github.sha is the tag object for
          # those, not the commit the images were built from.
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          short="${commit:0:7}"
          version="${GITHUB_REF_NAME#v}"
          ref="${REGISTRY}/${OWNER}/${{ matrix.image }}"
          echo "Promoting ${ref}:sha-${short} -> ${ref}:${version}"
          for i in $(seq 1 40); do
            if docker buildx imagetools inspect "${ref}:sha-${short}" >/dev/null 2>&1; then
              break
            fi
            [ "$i" -eq 40 ] && { echo "::error::${ref}:sha-${short} never appeared — publish-images for ${commit} missing/cancelled. Dispatch publish-images with ref=${commit} (backfill), then re-run this workflow."; exit 1; }
            echo "  sha manifest not published yet — waiting (${i}/40) ..."
            sleep 60
          done
          docker buildx imagetools create -t "${ref}:${version}" "${ref}:sha-${short}"
          docker buildx imagetools inspect "${ref}:${version}" --format '{{json .Manifest.Digest}}'
