# Versioned image tags — promote the same bytes (req-cicd-product-releases-1 +
# req-cicd-build-once-artifact's promote discipline, spec-cicd-hardening.md).
#
# On a vX.Y.Z tag push (created by the release-please lane), this does NOT
# rebuild anything: it retags the already-published, already-SLSA-attested
# multi-arch manifest for the tagged commit (`:sha-<short>`, minted by
# publish-images.yml on the main push that landed the release PR) as
# `:X.Y.Z`. Same digest, so the existing provenance attestation still
# verifies against the versioned tag:
#   gh attestation verify oci://ghcr.io/unified-systems-com/tap-web:X.Y.Z --owner unified-systems-com
#
# The poll loop exists because the tag usually arrives while publish-images is
# still building that same commit (~30 min worst case). Release-commit builds
# run in an isolated concurrency group (publish-images.yml, matched by
# contains() on the merge-commit BODY — see the comment there) precisely so a
# later main push cannot cancel them out from under this promotion (the
# v0.1.2 gap; recurred as v0.1.3 when the match was startsWith).
# If the loop still times out, backfill: dispatch publish-images
# with ref=<the tagged commit's full SHA> — it builds THAT commit and
# publishes its :sha-<short> without moving :latest — then re-run this
# workflow.

name: publish-release-tags

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish-release-tags-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: unified-systems-com

jobs:
  # core_ci on the exact release candidate (req-dev-validation-product-line-lanes-11): the
  # tag's commit runs the same core_ci line and cold-boot gate every PR runs — one
  # definition, core-ci.yml — BEFORE the sha manifest is promoted to the version tag. Red
  # blocks publication. A tap release gates on core only, never on a product or the
  # test_all union (ruling George 2026-09-19, restated 2026-09-25; tap#638).
  core-ci-line:
    name: core_ci line on the release candidate
    permissions:
      contents: read
    uses: ./.github/workflows/core-ci.yml
    with:
      ref: ${{ github.ref }}
      lane: line

  core-ci-cold-boot:
    name: core_ci cold-boot on the release candidate
    permissions:
      contents: read
    uses: ./.github/workflows/core-ci.yml
    with:
      ref: ${{ github.ref }}
      lane: cold-boot

  # Which commit, which tag, and are its images published? One job answers it for every
  # consumer below (the CVE scanner and the promotion), so the annotated-tag deref and the
  # poll loop exist once. Read-only: it waits and reports, it promotes nothing.
  candidate:
    name: resolve the release candidate
    needs: [core-ci-line, core-ci-cold-boot]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      sha_tag: ${{ steps.resolve.outputs.sha_tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve the tagged commit and wait for its sha manifests
        id: resolve
        env:
          IMAGES: tap-web tap-db
        run: |
          set -euo pipefail
          # Deref annotated tags explicitly — github.sha is the tag object for
          # those, not the commit the images were built from.
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          short="${commit:0:7}"
          version="${GITHUB_REF_NAME#v}"
          for image in ${IMAGES}; do
            ref="${REGISTRY}/${OWNER}/${image}"
            echo "Waiting for ${ref}:sha-${short}"
            for i in $(seq 1 40); do
              if docker buildx imagetools inspect "${ref}:sha-${short}" >/dev/null 2>&1; then
                break
              fi
              [ "$i" -eq 40 ] && { echo "::error::${ref}:sha-${short} never appeared — publish-images for ${commit} missing/cancelled. Dispatch publish-images with ref=${commit} (backfill), then re-run this workflow."; exit 1; }
              echo "  sha manifest not published yet — waiting (${i}/40) ..."
              sleep 60
            done
          done
          {
            echo "commit=${commit}"
            echo "sha_tag=sha-${short}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  # THE CVE GATE (req-cicd-base-image-lifecycle-2, tap#526). Read-only by construction: the
  # third-party scanner runs in a job with NO write scope at all, so it never shares a token
  # with the promotion (req-cicd-runner-least-privilege-3, the two-job split tap#265 names).
  # The SARIF upload — the only step needing security-events: write — is a separate
  # first-party job below.
  #
  # Ruling (George, 2026-09-17): a versioned release is blocked by a High/Critical
  # vulnerability WITH A FIX; `:latest` stays report-only (publish-images `scan`, nightly
  # trivy); a scanner that cannot complete blocks too. `--ignore-unfixed` is why an
  # unfixable CVE (zlib CVE-2026-85091, tap#491 — no upstream fix exists) does not block
  # every release. `.trivyignore` comes from the TAGGED commit's checkout, so a waiver
  # written later cannot retroactively pass an older release.
  release-cve-scan:
    name: cve gate ${{ matrix.image }}
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [tap-web, tap-db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      # The classifier is repo Python; give it the interpreter the repo declares rather than
      # whatever the runner image ships (req-dev-localexec-runner-interpreter).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      # guard-allow: req-cicd-runner-least-privilege — this job holds NO write scope; the
      # scanner shares it with nothing that can publish, and the SARIF upload lives elsewhere.
      - name: Scan the release candidate
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ needs.candidate.outputs.sha_tag }}
          format: sarif
          output: trivy-release-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          # The pinned action DROPS `severity` for SARIF output unless this is set: its
          # entrypoint unsets TRIVY_SEVERITY and scans every severity, so a fixable LOW would
          # refuse the release (tap#824). tap/tests/test_trivy_sarif_severity.py holds it.
          limit-severities-for-sarif: "true"
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      # Trivy's exit code cannot separate "found something" from "could not look"; the
      # classifier does, and names the CVEs either way. Both block the release.
      - name: Findings, or a scan that did not happen (fail-closed)
        env:
          REPORT: trivy-release-${{ matrix.image }}.sarif
          OUTCOME: ${{ steps.trivy.outcome }}
          SUBJECT: ${{ matrix.image }}:${{ needs.candidate.outputs.sha_tag }} -> ${{ needs.candidate.outputs.version }}
        run: python3 scripts/release_cve_gate.py --report "$REPORT" --scanner-outcome "$OUTCOME" --subject "$SUBJECT"
      - name: Hand the report to the upload job
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-release-${{ matrix.image }}
          path: trivy-release-${{ matrix.image }}.sarif
          if-no-files-found: ignore
          retention-days: 1

  # The findings must be READABLE, not just blocking — a refusal that names a CVE nobody can
  # look up is half a signal. `if: always()` so a blocked release still publishes its report.
  # First-party steps only; this is the one job holding security-events: write.
  release-cve-sarif:
    name: cve report ${{ matrix.image }}
    needs: release-cve-scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [tap-web, tap-db]
    steps:
      - name: Receive the report
        id: report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: trivy-release-${{ matrix.image }}
      - name: Upload SARIF to code scanning
        if: steps.report.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-release-${{ matrix.image }}.sarif
          category: trivy-release-${{ matrix.image }}

  retag:
    name: retag ${{ matrix.image }} as ${{ github.ref_name }}
    # core-ci-line / core-ci-cold-boot: the candidate passed core_ci. candidate: its images
    # exist. release-cve-scan: no fixable High/Critical, and the scan actually ran.
    needs: [core-ci-line, core-ci-cold-boot, candidate, release-cve-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # `gh attestation verify` reads the attestations API. tap is public, so this is
      # readable without it — but this gate fails CLOSED, and PR CI cannot exercise a
      # tag-push workflow, so the scope is granted explicitly rather than discovered by
      # a bricked release (Grok raised it as unverifiable from the diff, PR #629).
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        image: [tap-web, tap-db]
    steps:
      # Read-only clone for the tag→commit deref; the job's only write path is
      # the registry, so the git token has no business persisting on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # guard-allow: req-cicd-runner-least-privilege — the registry login IS this
      # job's write path (manifest retag); nothing else third-party shares the job.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # THE RELEASE GATE (req-cicd-sbom-4, tap#525). Before this step existed, `retag`
      # polled until the sha manifest EXISTED and then promoted it: presence read as
      # completeness. For 15 days (tap#518) and again on the very next change (tap#543)
      # that meant versioned releases were cut from images whose SBOM attestations had
      # never been produced — the workflow was green, the release was incomplete, and
      # nothing looked.
      #
      # Three states, two of which block:
      #   verified        every expected attestation verifies -> promote
      #   MISSING         the subject exists but carries no such attestation (the
      #                   attestations API answers 404) -> refuse
      #   NOT OBSERVABLE  the check could not run (network, auth, registry) -> refuse.
      #                   "could not look" must never render as "nothing to find".
      #
      # Subjects, confirmed against the real 2026-09-19 attestations rather than from
      # memory (run 35411727282): SLSA provenance is attested on the INDEX digest,
      # both SBOM predicates on each PER-ARCH child (req-cicd-sbom-5). Counts are not
      # a verdict — an unchanged image is re-attested on every publish, so tap-db's
      # amd64 digest carries 23 CycloneDX bundles; >=1 verifying bundle is the predicate.
      #
      # Only `docker` and `gh` are invoked, and every value arrives through env:, so
      # tap/tests/test_release_gates.py can execute this body against stubs and prove
      # all three outcomes — this workflow only runs on a release tag, so PR CI cannot.
      - name: Every published digest carries its attestations (fail-closed)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ matrix.image }}
          SHA_TAG: ${{ needs.candidate.outputs.sha_tag }}
          VERSION: ${{ needs.candidate.outputs.version }}
          COMMIT: ${{ needs.candidate.outputs.commit }}
          PROVENANCE_PREDICATE: https://slsa.dev/provenance/v1
          CYCLONEDX_PREDICATE: https://cyclonedx.org/bom
          SPDX_PREDICATE: https://spdx.dev/Document/v2.3
        run: |
          set -uo pipefail
          ref="${REGISTRY}/${OWNER}/${IMAGE}"
          # Go templates, not jq: the only externals here are docker and gh.
          index="$(docker buildx imagetools inspect "${ref}:${SHA_TAG}" --format '{{.Manifest.Digest}}')"
          children="$(docker buildx imagetools inspect "${ref}:${SHA_TAG}" --format '{{range .Manifest.Manifests}}{{.Digest}} {{end}}')"
          if [ -z "${index}" ] || [ -z "${children}" ]; then
            echo "::error::NOT OBSERVABLE: could not read ${ref}:${SHA_TAG} — refusing to promote ${VERSION}"
            exit 1
          fi
          blocked=0
          verify() {   # <digest> <predicate-type> <what>
            local digest="$1" predicate="$2" what="$3" out rc
            out="$(gh attestation verify "oci://${ref}@${digest}" --owner "${OWNER}" --predicate-type "${predicate}" 2>&1)"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "  ok             ${what} ${digest}"
              return 0
            fi
            if printf '%s' "$out" | grep -q 'HTTP 404'; then
              echo "::error::MISSING ${what} for ${ref}@${digest} (predicate ${predicate}) — the image published but this attestation never did."
            else
              echo "::error::NOT OBSERVABLE ${what} for ${ref}@${digest} (predicate ${predicate}) — the check could not complete: ${out}"
            fi
            blocked=1
            return 0
          }
          verify "${index}" "${PROVENANCE_PREDICATE}" "provenance (index)"
          for child in ${children}; do
            verify "${child}" "${CYCLONEDX_PREDICATE}" "SBOM CycloneDX"
            verify "${child}" "${SPDX_PREDICATE}" "SBOM SPDX"
          done
          if [ "$blocked" -ne 0 ]; then
            echo "::error::refusing to create ${ref}:${VERSION} — the release candidate is incomplete (tap#525). Recover by dispatching publish-images with ref=${COMMIT} (backfill; it republishes that commit without moving :latest), then re-run this workflow."
            exit 1
          fi
          # Hand the VERIFIED index digest to the promotion: the digest-threading law
          # (req-cicd-supply-chain-provenance-1) says a subject must never be re-reached
          # through a mutable name between check and use. Promoting `:sha-<short>` again
          # would re-resolve a tag that a concurrent republish could have moved since
          # these attestations were verified (Grok, PR #629).
          echo "index=${index}" >> "$GITHUB_OUTPUT"
          echo "All attestations verified for ${ref}@${index} (${SHA_TAG}) — promoting ${VERSION}."
      - name: Retag the attested sha manifest as the release version
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.candidate.outputs.version }}
          INDEX: ${{ steps.gate.outputs.index }}
        run: |
          set -euo pipefail
          ref="${REGISTRY}/${OWNER}/${IMAGE}"
          case "$INDEX" in sha256:*) ;; *) echo "::error::gate exported no index digest: '${INDEX}'"; exit 1 ;; esac
          # Content-addressed source: the exact bytes the gate verified, not a tag that
          # could have moved since (req-cicd-supply-chain-provenance-1).
          docker buildx imagetools create -t "${ref}:${VERSION}" "${ref}@${INDEX}"
          docker buildx imagetools inspect "${ref}:${VERSION}" --format '{{json .Manifest.Digest}}'
