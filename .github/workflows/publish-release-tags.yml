# Versioned image tags — promote the same bytes (req-cicd-product-releases-1 +
# req-cicd-build-once-artifact's promote discipline, spec-cicd-hardening.md).
#
# On a vX.Y.Z tag push (created by the release-please lane), this does NOT
# rebuild anything: it retags the already-published, already-SLSA-attested
# multi-arch manifest for the tagged commit (`:sha-<short>`, minted by
# publish-images.yml on the main push that landed the release PR) as
# `:X.Y.Z`. Same digest, so the existing provenance attestation still
# verifies against the versioned tag:
#   gh attestation verify oci://ghcr.io/unified-systems-com/tap-web:X.Y.Z --owner unified-systems-com
#
# The poll loop exists because the tag usually arrives while publish-images is
# still building that same commit (~30 min worst case). Release-commit builds
# run in an isolated concurrency group (publish-images.yml, matched by
# contains() on the merge-commit BODY — see the comment there) precisely so a
# later main push cannot cancel them out from under this promotion (the
# v0.1.2 gap; recurred as v0.1.3 when the match was startsWith).
# If the loop still times out, backfill: dispatch publish-images
# with ref=<the tagged commit's full SHA> — it builds THAT commit and
# publishes its :sha-<short> without moving :latest — then re-run this
# workflow.

name: publish-release-tags

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish-release-tags-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: unified-systems-com

jobs:
  # The BOM lane on the exact release candidate (req-dev-validation-bom-lane-3): the
  # tag's commit boots the full pinned set in the real image and passes its whole suite
  # BEFORE the sha manifest is promoted to the version tag. Red blocks publication.
  bom-boot:
    permissions:
      contents: read
    uses: ./.github/workflows/bom-boot.yml
    with:
      ref: ${{ github.ref }}

  retag:
    name: retag ${{ matrix.image }} as ${{ github.ref_name }}
    needs: bom-boot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [tap-web, tap-db]
    steps:
      # Read-only clone for the tag→commit deref; the job's only write path is
      # the registry, so the git token has no business persisting on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # guard-allow: req-cicd-runner-least-privilege — the registry login IS this
      # job's write path (manifest retag); nothing else third-party shares the job.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the tagged commit and wait for its sha manifest
        id: candidate
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          # Deref annotated tags explicitly — github.sha is the tag object for
          # those, not the commit the images were built from.
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          short="${commit:0:7}"
          version="${GITHUB_REF_NAME#v}"
          ref="${REGISTRY}/${OWNER}/${IMAGE}"
          echo "Promoting ${ref}:sha-${short} -> ${ref}:${version}"
          for i in $(seq 1 40); do
            if docker buildx imagetools inspect "${ref}:sha-${short}" >/dev/null 2>&1; then
              break
            fi
            [ "$i" -eq 40 ] && { echo "::error::${ref}:sha-${short} never appeared — publish-images for ${commit} missing/cancelled. Dispatch publish-images with ref=${commit} (backfill), then re-run this workflow."; exit 1; }
            echo "  sha manifest not published yet — waiting (${i}/40) ..."
            sleep 60
          done
          {
            echo "commit=${commit}"
            echo "sha_tag=sha-${short}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
      # THE RELEASE GATE (req-cicd-sbom-4, tap#525). Before this step existed, `retag`
      # polled until the sha manifest EXISTED and then promoted it: presence read as
      # completeness. For 15 days (tap#518) and again on the very next change (tap#543)
      # that meant versioned releases were cut from images whose SBOM attestations had
      # never been produced — the workflow was green, the release was incomplete, and
      # nothing looked.
      #
      # Three states, two of which block:
      #   verified        every expected attestation verifies -> promote
      #   MISSING         the subject exists but carries no such attestation (the
      #                   attestations API answers 404) -> refuse
      #   NOT OBSERVABLE  the check could not run (network, auth, registry) -> refuse.
      #                   "could not look" must never render as "nothing to find".
      #
      # Subjects, confirmed against the real 2026-09-19 attestations rather than from
      # memory (run 35411727282): SLSA provenance is attested on the INDEX digest,
      # both SBOM predicates on each PER-ARCH child (req-cicd-sbom-5). Counts are not
      # a verdict — an unchanged image is re-attested on every publish, so tap-db's
      # amd64 digest carries 23 CycloneDX bundles; >=1 verifying bundle is the predicate.
      #
      # Only `docker` and `gh` are invoked, and every value arrives through env:, so
      # tap/tests/test_release_gates.py can execute this body against stubs and prove
      # all three outcomes — this workflow only runs on a release tag, so PR CI cannot.
      - name: Every published digest carries its attestations (fail-closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ matrix.image }}
          SHA_TAG: ${{ steps.candidate.outputs.sha_tag }}
          VERSION: ${{ steps.candidate.outputs.version }}
          COMMIT: ${{ steps.candidate.outputs.commit }}
          PROVENANCE_PREDICATE: https://slsa.dev/provenance/v1
          CYCLONEDX_PREDICATE: https://cyclonedx.org/bom
          SPDX_PREDICATE: https://spdx.dev/Document/v2.3
        run: |
          set -uo pipefail
          ref="${REGISTRY}/${OWNER}/${IMAGE}"
          # Go templates, not jq: the only externals here are docker and gh.
          index="$(docker buildx imagetools inspect "${ref}:${SHA_TAG}" --format '{{.Manifest.Digest}}')"
          children="$(docker buildx imagetools inspect "${ref}:${SHA_TAG}" --format '{{range .Manifest.Manifests}}{{.Digest}} {{end}}')"
          if [ -z "${index}" ] || [ -z "${children}" ]; then
            echo "::error::NOT OBSERVABLE: could not read ${ref}:${SHA_TAG} — refusing to promote ${VERSION}"
            exit 1
          fi
          blocked=0
          verify() {   # <digest> <predicate-type> <what>
            local digest="$1" predicate="$2" what="$3" out rc
            out="$(gh attestation verify "oci://${ref}@${digest}" --owner "${OWNER}" --predicate-type "${predicate}" 2>&1)"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "  ok             ${what} ${digest}"
              return 0
            fi
            if printf '%s' "$out" | grep -q 'HTTP 404'; then
              echo "::error::MISSING ${what} for ${ref}@${digest} (predicate ${predicate}) — the image published but this attestation never did."
            else
              echo "::error::NOT OBSERVABLE ${what} for ${ref}@${digest} (predicate ${predicate}) — the check could not complete: ${out}"
            fi
            blocked=1
            return 0
          }
          verify "${index}" "${PROVENANCE_PREDICATE}" "provenance (index)"
          for child in ${children}; do
            verify "${child}" "${CYCLONEDX_PREDICATE}" "SBOM CycloneDX"
            verify "${child}" "${SPDX_PREDICATE}" "SBOM SPDX"
          done
          if [ "$blocked" -ne 0 ]; then
            echo "::error::refusing to create ${ref}:${VERSION} — the release candidate is incomplete (tap#525). Recover by dispatching publish-images with ref=${COMMIT} (backfill; it republishes that commit without moving :latest), then re-run this workflow."
            exit 1
          fi
          echo "All attestations verified for ${ref}:${SHA_TAG} — promoting ${VERSION}."
      - name: Retag the attested sha manifest as the release version
        env:
          IMAGE: ${{ matrix.image }}
          SHA_TAG: ${{ steps.candidate.outputs.sha_tag }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          ref="${REGISTRY}/${OWNER}/${IMAGE}"
          docker buildx imagetools create -t "${ref}:${VERSION}" "${ref}:${SHA_TAG}"
          docker buildx imagetools inspect "${ref}:${VERSION}" --format '{{json .Manifest.Digest}}'
