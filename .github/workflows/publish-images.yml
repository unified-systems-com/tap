# Publish the built tap-web / tap-db images to GHCR on every main push
# (req-cicd-build-once-artifact — registry decision: GHCR for the public dev/CI
# artifact; ECR Public remains the base-image mirror).
#
# Consumers:
#   * scripts/spawn-session.sh + scripts/stand-up.sh pull these instead of
#     building (docker-compose.yml image: fields) — anonymous, no credential.
#   * CI lanes borrow the :buildcache-<arch> refs via cache-from so a GHA-cache
#     miss falls back to registry layers instead of a full rebuild.
#
# Architecture: one native build per arch (amd64 on ubuntu-latest, arm64 on the
# free-for-public-repos arm runners — QEMU would crawl through the OpenSSL FIPS
# + cryptography compiles), pushed BY DIGEST (no staging tag), then merged into
# the multi-arch :sha-<short> (+ :latest for tip builds) manifests and attested
# (SLSA provenance via the Sigstore public-good instance; verify with
#   gh attestation verify oci://ghcr.io/unified-systems-com/tap-web:latest --owner unified-systems-com).
#
# DIGEST THREADING (req-cicd-supply-chain-provenance-1): every hop between jobs
# is content-addressed. Tags are the only mutable thing in a registry — a
# tag-based hop hands anyone with packages:write a TOCTOU window to swap
# content between jobs, and the attestation step would then SIGN the tampered
# bytes (an honest signature laundering a dishonest artifact). So: build jobs
# push by digest and ship those digests to the manifest job as workflow
# artifacts (integrity-held by the same GitHub infra that signs the
# attestation — no new trust root); the merge consumes ref@digest; and after
# tagging, the merge re-reads the index ONCE and fails closed unless its
# children are EXACTLY the two built digests. Only that verified digest is
# attested. Side effect: no staging tags = no registry litter.
#
# Backfill (workflow_dispatch `ref`): builds that commit and publishes ONLY its
# :sha-<short> manifest, never moving :latest. This is the recovery path for a
# release commit whose main-push build was superseded before publishing — see
# publish-release-tags.yml.
#
# Runs OFF the promote critical path: promote pushes main and moves on; this
# fires behind it. Only TAP_FIPS=1 (the published posture) is built.
name: publish-images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Backfill: full 40-hex commit SHA (on main) to build. Publishes
          :sha-<short> only — :latest does not move. Leave empty to build
          main's tip and move :latest (the normal recovery dispatch).
        required: false
        default: ""

# Superseded publishes just waste runners — newest main wins — EXCEPT for runs
# whose :sha-<short> manifest is a release contract surface: a release-please
# release commit (publish-release-tags.yml promotes its sha manifest to the
# versioned tag; cancelling it is exactly the v0.1.2 gap) and explicit ref
# backfills. Those get an isolated group so later main pushes cannot cancel
# them. Detection is contains(), NOT startsWith(): release PRs land as MERGE
# COMMITS whose message begins "Merge pull request #NN…" with the
# "chore(main): release" title in the BODY — a startsWith predicate never
# matches in practice, which is how v0.1.3's build got cancelled by the very
# race this guard exists to stop (2026-08-20). A stray commit merely
# MENTIONING the phrase gets a harmless uncancellable build — cheap, safe
# failure direction. Transient: a slow release build finishing after a newer
# tip build leaves :latest one release behind until the next push — harmless,
# and the alternative (cancelling the release build) broke versioned tags
# twice for real.
concurrency:
  group: "publish-images-${{ ((github.event_name == 'workflow_dispatch' && inputs.ref != '') || contains(github.event.head_commit.message, 'chore(main): release')) && github.run_id || 'main' }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: unified-systems-com
  # The commit being built. For push events and empty-ref dispatches this is
  # the triggering sha; for backfills it is the operator-supplied commit.
  BUILD_SHA: ${{ inputs.ref || github.sha }}
  # Tip builds move :latest; ref backfills never do. Read by the promote-latest
  # job's condition as `inputs.ref == ''` (a job-level `if:` cannot see `env`).
  TAG_LATEST: ${{ inputs.ref == '' }}

jobs:
  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [tap-web, tap-db]
        arch: [amd64, arm64]
        include:
          - image: tap-web
            dockerfile: Dockerfile
          - image: tap-db
            dockerfile: docker/postgres/Dockerfile
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Validate backfill ref
        if: inputs.ref != ''
        run: |
          if ! [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref input must be a full 40-hex commit SHA (got: ${BUILD_SHA})"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false  # build needs the tree, not a token in .git config
      # guard-allow: req-cicd-runner-least-privilege — the docker/* steps ARE the write this
      # job exists for (verified-creator tier); nothing else shares the job's packages:write.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          # push-by-digest: no tag is ever written by the build legs — the digest
          # is the ONLY name this artifact has until the manifest job tags the
          # verified merged index (req-cicd-supply-chain-provenance-1).
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Provenance lane is GitHub attestations (attest-build-provenance, below);
          # BuildKit's embedded provenance is disabled so the pushed object is a bare
          # single-platform manifest and the merge step can verify the index children
          # are EXACTLY the built digests — an attached attestation manifest would
          # make that strict equality impossible.
          provenance: false
          build-args: |
            TAP_FIPS=1
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max
      - name: Record built digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digest"
          case "${{ steps.build.outputs.digest }}" in
            sha256:*) ;;
            *) echo "::error::build produced no valid digest"; exit 1 ;;
          esac
          printf '%s' "${{ steps.build.outputs.digest }}" \
            > "${RUNNER_TEMP}/digest/${{ matrix.image }}-${{ matrix.arch }}"
      - name: Ship digest to the manifest job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: manifest + attest ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [tap-web, tap-db]
    # No checkout: this job reads no repo files. The SBOM lane (which does) moved to the
    # read-only `sbom` job and the first-party-only `attest-sbom` job below (tap#507).
    steps:
      # guard-allow: req-cicd-runner-least-privilege — the registry login IS this job's
      # write path (manifest push + attestation); nothing else third-party shares the job.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Receive built digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digest
      - name: Merge per-arch digests into multi-arch tags (verified)
        id: merge
        run: |
          ref="${REGISTRY}/${OWNER}/${{ matrix.image }}"
          short="${BUILD_SHA:0:7}"
          amd="$(cat "${RUNNER_TEMP}/digest/${{ matrix.image }}-amd64")"
          arm="$(cat "${RUNNER_TEMP}/digest/${{ matrix.image }}-arm64")"
          case "$amd" in sha256:*) ;; *) echo "::error::bad amd64 digest: ${amd}"; exit 1 ;; esac
          case "$arm" in sha256:*) ;; *) echo "::error::bad arm64 digest: ${arm}"; exit 1 ;; esac
          # `:latest` is NOT created here. An OCI index cannot exist untagged, so
          # `:sha-<short>` is minted now (it is what provenance and every attestation
          # bind to), but the mutable pointer consumers follow only moves once the
          # SBOMs are attested — see the promote-latest job (tap#525).
          tags=(-t "${ref}:sha-${short}")
          # Content-addressed sources: ref@digest can only resolve to the bytes
          # the build legs produced, or fail. No tag is consumed anywhere here.
          docker buildx imagetools create "${tags[@]}" "${ref}@${amd}" "${ref}@${arm}"
          # Fail-closed post-create verification: read the just-tagged index ONCE
          # and require its children to be EXACTLY the two built digests. A swap
          # of the tag between create and attest — or anything unexpected riding
          # in the index — refuses attestation instead of signing it.
          manifest_json="$(docker buildx imagetools inspect "${ref}:sha-${short}" --format '{{json .Manifest}}')"
          children="$(printf '%s' "$manifest_json" | jq -r '[.manifests[].digest] | sort | join(",")')"
          expected="$(printf '%s\n%s\n' "$amd" "$arm" | sort | paste -sd, -)"
          if [ "$children" != "$expected" ]; then
            echo "::error::index children (${children}) != built digests (${expected}) — refusing to attest (req-cicd-supply-chain-provenance-1)"
            exit 1
          fi
          digest="$(printf '%s' "$manifest_json" | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "amd64=${amd}" >> "$GITHUB_OUTPUT"
          echo "arm64=${arm}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # SBOM lane (spec-cicd-sbom.md), split in two so no third-party code shares a
  # token that can sign (tap#507, req-cicd-runner-least-privilege-3):
  #
  #   sbom         READ-ONLY token. One pinned-Syft derivation per built per-arch
  #                digest -> CycloneDX (primary) + SPDX, supplemental out-of-band
  #                components merged in with artifact-computed hashes, then the
  #                fail-closed schema/minimum-elements/canary gates
  #                (req-cicd-sbom-1..7, -11) and the unknown-executables budget
  #                (req-cicd-sbom-12). Its tooling (setup-uv, jsonschema from the
  #                locked `ci-tooling` group) lives here, away from id-token.
  #   attest-sbom  FIRST-PARTY STEPS ONLY, holds id-token/attestations. Refuses to
  #                sign unless every document names, inside its own content, the
  #                exact per-arch digest it is about to be bound to.
  #
  # Residual, stated rather than hidden: the split protects the signing TOKEN, not
  # the CONTENT. A compromised dependency in `sbom` can still hand over a false
  # document; the binding check pins it to the right subject, not to the truth.
  # Any failure in `sbom` stops `attest-sbom` (needs), so nothing unvetted is signed.
  # ---------------------------------------------------------------------------
  sbom:
    name: sbom ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        image: [tap-web, tap-db]
        include:
          # The supplemental declares identity and rationale; the Dockerfile declares
          # version and digest, and generate.py joins them (req-cicd-sbom-3-4, tap#225).
          # Both travel together or a copied-image component has no version at all.
          - image: tap-web
            supplemental: docker/sbom-supplemental.json
            dockerfile: Dockerfile
          - image: tap-db
            supplemental: docker/postgres/sbom-supplemental.json
            dockerfile: docker/postgres/Dockerfile
    steps:
      # Tree needed for the SBOM lane (scripts/sbom + supplemental manifests + schemas).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false
      - name: Receive built digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digest
      # The SBOM scripts are written against the repo's Python (tap/fips_pins.py uses 3.14
      # syntax); run them on it, not on whatever `python3` the runner image carries. Derived
      # from the requires-python that governs the container build, as product-lines.yml and
      # grype-nightly.yml do (tap#518: this step's absence broke every publish from 09-02).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      # The generator's third-party imports (jsonschema + referencing) come from the
      # core's lockfile — the `ci-tooling` group, synced --frozen: the versions and
      # hashes uv.lock records, no project install. Never `pip install x==v`: that
      # restated a version the lock owns (it had drifted to 4.23.0 vs 4.26.0) and
      # verified no bytes (tap#507, SonarCloud S8541). No Actions cache: this lane
      # feeds a signing job, so it restores nothing another run wrote.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Sync the SBOM tooling's locked dependency group
        run: uv sync --frozen --no-build --no-install-project --only-group ci-tooling
      - name: Generate + validate SBOMs (both arches, both formats)
        env:
          IMAGE: ${{ matrix.image }}
          SUPPLEMENTAL: ${{ matrix.supplemental }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          for arch in amd64 arm64; do
            digest="$(cat "${RUNNER_TEMP}/digest/${IMAGE}-${arch}")"
            case "$digest" in sha256:*) ;; *) echo "::error::bad ${arch} digest: ${digest}"; exit 1 ;; esac
            uv run --frozen --no-sync --no-build python scripts/sbom/generate.py \
              --image "${IMAGE}" \
              --ref "${REGISTRY}/${OWNER}/${IMAGE}" \
              --digest "${digest}" \
              --arch "${arch}" \
              --supplemental "${SUPPLEMENTAL}" \
              --dockerfile "${DOCKERFILE}" \
              --out-dir "${RUNNER_TEMP}/sboms"
          done
      # Unknowns budget (req-cicd-sbom-12), FAIL-CLOSED since 2026-08-24: any
      # executable no apk package owns, no supplemental entry declares, and no
      # exclusion covers kills the publish BEFORE attestation — the next
      # fips.so-class hand-built binary cannot ship undeclared. Flipped per the
      # staged plan after run 32686098463 proved 0 unknowns on all four
      # per-arch digests (both images, both arches, js-vendor stage included).
      # Operational failures (pull/docker/syft/script error) fail the job too:
      # a check that cannot run must not pass (Codex finding on PR #115).
      - name: Unknown-executables budget (fail-closed)
        env:
          IMAGE: ${{ matrix.image }}
          SUPPLEMENTAL: ${{ matrix.supplemental }}
        run: |
          for arch in amd64 arm64; do
            digest="$(cat "${RUNNER_TEMP}/digest/${IMAGE}-${arch}")"
            uv run --frozen --no-sync --no-build python scripts/sbom/oob_detect.py \
              --unknowns "${REGISTRY}/${OWNER}/${IMAGE}@${digest}" \
              --supplemental "${SUPPLEMENTAL}" \
              --fail
          done
      - name: Hand the vetted SBOMs to the signing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ runner.temp }}/sboms/${{ matrix.image }}-*.json
          if-no-files-found: error
          retention-days: 1

  attest-sbom:
    name: attest sbom ${{ matrix.image }}
    # manifest: the per-arch digests are verified as the tagged index's exact children.
    # sbom: every gate passed. Either failing means nothing below is signed.
    needs: [manifest, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      packages: write   # push-to-registry: the attestation is stored beside the image
    strategy:
      matrix:
        image: [tap-web, tap-db]
    # First-party steps only (actions/*): no checkout, no third-party action, so the
    # signing token is never reachable by code outside GitHub's own namespace.
    steps:
      - name: Receive built digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digest
      - name: Receive the vetted SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ runner.temp }}/sboms
      # Subject binding, fail-closed: each document must name, in its own content, the
      # image ref and the exact per-arch digest it is about to be signed against —
      # CycloneDX metadata.component {type: container, name: ref, version: digest};
      # SPDX: exactly one DESCRIBES-ed CONTAINER package {name: ref, versionInfo:
      # digest} (the shapes Syft writes for `docker:ref@digest`, checked against the
      # 2026-09-17 published attestations). A document for another digest, another
      # image, or with no subject at all is refused rather than signed.
      - name: Bind each SBOM to its digest (fail-closed)
        id: bind
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          ref="${REGISTRY}/${OWNER}/${IMAGE}"
          for arch in amd64 arm64; do
            digest="$(cat "${RUNNER_TEMP}/digest/${IMAGE}-${arch}")"
            case "$digest" in sha256:*) ;; *) echo "::error::bad ${arch} digest: ${digest}"; exit 1 ;; esac
            cdx="${RUNNER_TEMP}/sboms/${IMAGE}-${arch}.cdx.json"
            spdx="${RUNNER_TEMP}/sboms/${IMAGE}-${arch}.spdx.json"
            jq -e --arg n "$ref" --arg d "$digest" \
              '.metadata.component | .type == "container" and .name == $n and .version == $d' "$cdx" >/dev/null \
              || { echo "::error::${cdx##*/} does not name ${ref}@${digest} as its subject — refusing to attest"; exit 1; }
            jq -e --arg n "$ref" --arg d "$digest" '
              [.relationships[] | select(.spdxElementId == "SPDXRef-DOCUMENT" and .relationshipType == "DESCRIBES") | .relatedSpdxElement] as $described
              | [.packages[] | select(.SPDXID as $id | $described | index($id)) | select(.primaryPackagePurpose == "CONTAINER")]
              | length == 1 and .[0].name == $n and .[0].versionInfo == $d' "$spdx" >/dev/null \
              || { echo "::error::${spdx##*/} does not describe exactly one container ${ref}@${digest} — refusing to attest"; exit 1; }
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
          done
      # `push-to-registry` stores each attestation beside the image, which needs
      # registry credentials in the Docker config. The combined job used to get them
      # from docker/login-action; this job is first-party-only, so it logs in with the
      # same GITHUB_TOKEN in a plain run step instead — no third-party code beside the
      # signing token (req-cicd-runner-least-privilege-3). Without it every attest step
      # fails `No credentials found for registry ghcr.io` (tap#543, run 35257723153).
      # Values reach the shell through env:, never spliced into run:.
      - name: Log in to ${{ env.REGISTRY }} (push-to-registry needs Docker credentials)
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      # Per-arch SBOMs attested against their own digests (req-cicd-sbom-4/-5);
      # actions/attest infers the predicate type from the document (CycloneDX →
      # cyclonedx.org/bom, SPDX → spdx.dev/Document/v2.3).
      - name: Attest SBOM (amd64, CycloneDX)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          subject-digest: ${{ steps.bind.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/sboms/${{ matrix.image }}-amd64.cdx.json
          push-to-registry: true
      - name: Attest SBOM (amd64, SPDX)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          subject-digest: ${{ steps.bind.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/sboms/${{ matrix.image }}-amd64.spdx.json
          push-to-registry: true
      - name: Attest SBOM (arm64, CycloneDX)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          subject-digest: ${{ steps.bind.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sboms/${{ matrix.image }}-arm64.cdx.json
          push-to-registry: true
      - name: Attest SBOM (arm64, SPDX)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          subject-digest: ${{ steps.bind.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sboms/${{ matrix.image }}-arm64.spdx.json
          push-to-registry: true

  # `:latest` moves LAST, and only once this commit's SBOMs are attested (tap#525).
  # Before this job existed the merge step tagged `:latest` up front, so a failed
  # SBOM lane left the pointer consumers follow aimed at an image whose attestations
  # were never produced — which is exactly what happened for 15 days (tap#518) and
  # again on the next change (tap#543). `:sha-<short>` still lands early: an OCI index
  # cannot exist untagged, and every attestation binds to those digests.
  #
  # Content-addressed sources (`ref@digest`), same as the merge step: this re-points a
  # tag at bytes that are already published and now attested; it consumes no tag and
  # rebuilds nothing. A backfill run (`inputs.ref`) never moves `:latest`, which is
  # why the condition mirrors TAG_LATEST rather than reading it (a job-level `if:`
  # cannot see `env`).
  promote-latest:
    name: promote latest ${{ matrix.image }}
    needs: [manifest, attest-sbom]
    if: ${{ inputs.ref == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [tap-web, tap-db]
    # First-party steps only: `docker login` in a run step instead of the third-party
    # login action, so nothing outside GitHub's namespace shares this job's
    # packages:write (req-cicd-runner-least-privilege-3).
    steps:
      - name: Receive built digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digest
      - name: Log in to ${{ env.REGISTRY }}
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      - name: Move :latest onto the attested digests
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          ref="${REGISTRY}/${OWNER}/${IMAGE}"
          amd="$(cat "${RUNNER_TEMP}/digest/${IMAGE}-amd64")"
          arm="$(cat "${RUNNER_TEMP}/digest/${IMAGE}-arm64")"
          case "$amd" in sha256:*) ;; *) echo "::error::bad amd64 digest: ${amd}"; exit 1 ;; esac
          case "$arm" in sha256:*) ;; *) echo "::error::bad arm64 digest: ${arm}"; exit 1 ;; esac
          docker buildx imagetools create -t "${ref}:latest" "${ref}@${amd}" "${ref}@${arm}"
          docker buildx imagetools inspect "${ref}:latest" --format '{{json .Manifest.Digest}}'

  # Trivy scan of the just-published image (req-cicd-security-scanning-4 /
  # req-cicd-base-image-lifecycle-2). REPORT-ONLY for now: findings land as SARIF
  # in code scanning (Security tab), never blocking the publish. The planned gate
  # tightening (fail on High/Critical WITH a fix available, after a week of
  # signal) belongs pre-push in the build legs — this job stays the reporting
  # layer. Waivers: .trivyignore, every entry with a mandatory reason comment
  # (the operator-waives discipline; see spec-cicd-hardening.md). The nightly
  # sweep of :latest lives in trivy-nightly.yml (new CVEs land against images
  # that haven't changed). One scan covers OS packages AND the Python closure —
  # the deps-warm wheel cache means the scanned artifact carries both.
  # Scans :sha-<short> (the manifest this run just published) rather than
  # :latest, which a backfill run does not move.
  scan:
    name: trivy scan ${{ matrix.image }}
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [tap-web, tap-db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7   # for .trivyignore
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false  # never leave the job token readable in .git config
      - name: Resolve published tag
        id: meta
        run: echo "short=${BUILD_SHA:0:7}" >> "$GITHUB_OUTPUT"
      # guard-allow: req-cicd-runner-least-privilege — scanner needs no token; this job's
      # only write scope is security-events, consumed by the first-party SARIF upload step.
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:sha-${{ steps.meta.outputs.short }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: "0"   # report-only — the gate flip changes this pre-push, not here
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
