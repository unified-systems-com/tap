# Reusable per-plugin CI (req-tap-plugin-extdev-repo-ci, spec-tap-plugin-external-development.md).
#
# The CI an EXTERNAL plugin repository runs against a KNOWN-GOOD core on free generic
# runners. A plugin repo's own workflow is a thin caller:
#
#   jobs:
#     tap:
#       uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@v1
#       # REQUIRED, on this calling job (tap#772). GitHub checks every job of a called workflow
#       # against the caller's grant BEFORE starting anything, including a job whose `if:` is
#       # false, and a job asking for more than the caller grants fails the WHOLE run at startup
#       # (`startup_failure`, zero jobs, no log). The upload job below asks for
#       # `security-events: write`, so every caller grants it here. A job-level block replaces
#       # the workflow-level one, so `contents: read` must be restated beside it.
#       permissions:
#         contents: read
#         security-events: write
#       with:
#         plugin_slug: my_plugin
#         harness_ref: v0.2.0          # pin the core harness — reproducible, known-good
#         boot_profile: ci/my.boot.json  # optional: boot + run the plugin's tests
#       secrets:
#         harness_pat:    ${{ secrets.TAP_CORE_RO_PAT }}      # read core (private)
#         plugins_ro_pat: ${{ secrets.TAP_PLUGINS_RO_PAT }}   # git-install private siblings
#
# No job here holds `contents: write`, and a caller should grant it to none of them (the Q20
# ruling, George 2026-09-25). A caller that granted it for the retired dependency-graph
# submission can drop it once its pin is at or past this change.
#
# Reciprocal of product-lines.yml's `test_all` lane: that lane owns FULL-SET truth
# (every pinned plugin booted in the real image); this lane owns ONE external plugin
# against a pinned core. It never runs the heavy gryphon corpus — that is the
# full-set lane's job, never external.
#
# Four jobs:
#   conformance   — always. `validate_plugin --strict` (structure level, Django-free) against
#                   the pinned harness. Fast, no image, no DB. THE admission gate.
#   boot-and-test — opt-in (a `boot_profile` was passed). Boots the caller's profile in a real
#                   compose stack and runs the plugin's in-package tests (loads/runs coverage).
#                   Also walks the plugin's OWN dependency closure out of the venv the boot
#                   resolved (tap#664: stops at sibling plugins) into a CycloneDX document.
#   scan-dependencies — read-only. Trivy scans that document. A HIGH/CRITICAL not waived in the
#                   plugin repo's `.trivyignore` (each entry under a reason comment) FAILS THE
#                   RUN, on every event — INCLUDING one with no fix available, unlike the release
#                   gate (Q94d, 2026-09-26; the reason is on the gate step). Every finding, at
#                   every severity, goes to the job summary.
#   upload-dependency-sarif — holds `security-events: write` and nothing else; runs no plugin
#                   code and checks nothing out. Uploads the SARIF to the CALLER's code scanning,
#                   only when the caller is the plugin repo itself (`plugin_repo` empty) and only
#                   on a push to its default branch or a schedule — never on a pull request.
#                   Every caller must grant that scope anyway; see the example above.
#
# STATUS: In Development — conformance fails closed without a `ci` record and the harness
# is the plugin's declared floor (tap#365, 2026-09-09); boot-and-test's summary + zero-test
# red await their first observation on a plugin PR.

name: tap-plugin-ci

on:
  workflow_call:
    inputs:
      plugin_slug:
        description: "The plugin slug (== manifest slug == tap_plugin.<slug> namespace)."
        required: true
        type: string
      plugin_repo:
        description: >-
          The plugin repository to test. Empty (the default) means the CALLER repo —
          the per-plugin-repo CI case. Core's nightly matrix passes each discovered
          tap-plugin-* repo explicitly; without this, a cross-repo caller would check
          out ITSELF as the plugin (core validating core-as-a-plugin — a false red).
        required: false
        type: string
        default: ""
      harness_repo:
        description: "The core TAP repo used as the dev harness."
        required: false
        type: string
        default: unified-systems-com/tap
      harness_ref:
        description: >-
          OVERRIDE ONLY. Empty (the default) means the harness is the plugin's declared
          floor: core at the tag v<lower bound of requires_tap>, resolved to a SHA by
          tap.ci_harness (req-tap-plugin-extdev-repo-ci-7) — a harness above the floor does
          not prove the floor. Set it for the nightly (`main`: a compatibility forecast, a
          different question) or a one-off debug run; never as a PR default.
        required: false
        type: string
        default: ""
      plugin_subdir:
        description: "Path to the plugin ROOT within the caller repo (holds pyproject.toml + tap_plugin/<slug>/)."
        required: false
        type: string
        default: "."
      boot_profile:
        description: >-
          DEPRECATED (req-boot-bootstrap-ci-record-2): path within the caller repo to the
          retired repo-root CI record. Ship tap_plugin/<slug>/boot/ci.boot.json instead;
          without either, conformance fails closed.
        required: false
        type: string
        default: ""
      after_tests_command:
        description: >-
          OPTIONAL. A command run INSIDE the booted web container (cwd /app, the harness
          tree with the plugin editable at _dev-plugins/<slug>) after the in-package tests
          pass — e.g. a fuzz campaign or a corpus-drift scan that needs the real stack.
          Its output is tee'd to after-tests.log; a non-zero exit fails the job. Empty
          (the default) runs nothing. Trust boundary: identical to the in-package test
          step — the same container, the same mounts, the same public job log — so it
          grants nothing a plugin's own tests could not already do.
        required: false
        type: string
        default: ""
      after_tests_artifact_paths:
        description: >-
          OPTIONAL. Newline-separated paths, relative to the harness tree (the container's
          /app, so anything the after-tests command wrote there is visible), uploaded as
          the `after-tests` artifact for a following job to consume: a ledger row to land
          on a branch, a summary a verdict job reds the run on. CONFINED: each path must RESOLVE (real
          path, links followed) to inside `_dev-plugins/<plugin_slug>/` or
          `after-tests-out/`, and may not be or contain a symbolic link — the harness tree
          also holds this run's `.env`, and an artifact on a public repo is downloadable
          by anyone, so anything else is refused. What this bounds: a path DECLARATION
          cannot export the runner tree. What it does not bound: the after-tests command
          itself, which can copy anything it can read into `after-tests-out/` — it holds
          the in-package test step's rights, no more and no less, and those tests already
          print to the public job log. A caller that wires `plugins_ro_pat` should know
          both steps can read it; the playground nightly wires no secret. Empty uploads
          nothing.
        required: false
        type: string
        default: ""
      boot_and_test_timeout_minutes:
        description: "Job timeout for boot-and-test. The default fits the tests; a caller running a long after-tests command raises it."
        required: false
        type: number
        default: 25
    secrets:
      harness_pat:
        description: "Token with read access to the (private) core repo. Defaults to the caller's GITHUB_TOKEN."
        required: false
      plugins_ro_pat:
        description: "Read-only GitHub PAT for git-installing private sibling plugins during boot."
        required: false

# Least-privilege GITHUB_TOKEN: every job but one only checks out, builds and scans (no
# registry push; the `after-tests` and hand-over artifacts ride the runtime token and need
# no write scope). The one exception is `upload-dependency-sarif`, which raises its own grant
# to `security-events: write` at job level. For cross-repo callers this can only narrow,
# never widen, the caller's own grant.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Conformance — the always-on admission gate. Django-free structure validation
  # against the pinned harness, on a bare runner (no image, no DB). Fast.
  # ---------------------------------------------------------------------------
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Whether the plugin ships the conventional in-package CI record. Emitted from
      # HERE because `if:` on a job cannot see repository contents, and this job has
      # the plugin checked out already — no extra job, no extra checkout.
      has_ci_record: ${{ steps.ci_record.outputs.present }}
      # The ONE core commit this run is about (req-tap-plugin-extdev-repo-ci-2/-7):
      # resolved once here, consumed by boot-and-test, printed in both summaries.
      harness_sha: ${{ steps.harness.outputs.ref }}
      harness_source: ${{ steps.harness.outputs.source }}
      harness_floor: ${{ steps.harness.outputs.floor }}
    steps:
      - name: Checkout plugin (${{ inputs.plugin_repo || github.repository }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.plugin_repo || github.repository }}
          persist-credentials: false
          path: plugin

      # Two pins, independent (req-tap-plugin-extdev-repo-ci-9): the caller pins THIS
      # workflow (`plugin-ci.yml@<sha>` — which validation logic runs); the plugin's
      # manifest pins the HARNESS (`requires_tap` — which core it runs against). The
      # resolver is tooling that belongs to the workflow, so it is checked out at the
      # workflow's own commit, before any harness exists.
      # `job.workflow_sha` is the commit of the file that defines THIS job — the reusable
      # workflow's, when the job comes from one. `github.workflow_sha` is the CALLER's
      # (observed 2026-09-09 on tap-plugin-identity-core PR# 3: "not our ref").
      - name: Checkout the workflow's tooling (${{ inputs.harness_repo }}@${{ job.workflow_sha }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ job.workflow_sha }}
          token: ${{ secrets.harness_pat || github.token }}
          persist-credentials: false
          path: _tooling

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The runner's only extra packages come from core's lockfile: the `ci-tooling`
      # dependency group (jsonschema, packaging), synced --frozen into _tooling's own
      # venv — locked versions and hashes, no core project install, no index resolution.
      - name: Sync the tooling's locked dependency group
        run: uv sync --project _tooling --frozen --no-build --no-install-project --only-group ci-tooling

      # The floor decides the harness (req-tap-plugin-extdev-repo-ci-7): core at the tag
      # v<lower bound of requires_tap>, resolved to a SHA. No floor, or a floor that is
      # not a released core, fails HERE with the reason. `harness_ref` is the override.
      - name: Resolve the core harness from the plugin's floor
        id: harness
        env:
          PYTHONPATH: ${{ github.workspace }}/_tooling
          MANIFEST: ${{ github.workspace }}/plugin/${{ inputs.plugin_subdir }}/tap_plugin/${{ inputs.plugin_slug }}/tap-plugin.toml
          HARNESS_REPO: ${{ inputs.harness_repo }}
          HARNESS_OVERRIDE: ${{ inputs.harness_ref }}
        run: |
          uv run --project _tooling --frozen --no-sync --no-build \
            python -m tap.ci_harness --manifest "$MANIFEST" --repo "$HARNESS_REPO" --override "$HARNESS_OVERRIDE"

      - name: Checkout core harness (${{ inputs.harness_repo }}@${{ steps.harness.outputs.ref }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ steps.harness.outputs.ref }}
          token: ${{ secrets.harness_pat || github.token }}
          # The token is needed to FETCH and for nothing after. Left persisted it is
          # written into .git/config, and this workflow's whole point is to then build
          # and execute PR-controlled plugin code — build hooks and tests — which could
          # read it back out. Nothing here pushes (req-sec-cheap-edges).
          persist-credentials: false
          path: _harness

      # Structure-level validation needs only pure-python core modules
      # (tap_plugins.manifest / tap.core_version / tap.plugin_deps / tap.jsonfiles),
      # so run it with core on PYTHONPATH + just jsonschema + packaging — no full
      # core `uv sync`, no Django. The pinned harness IS the version requires_tap
      # is checked against, so this also enforces the compatibility floor.
      # The validator is WORKFLOW logic, so it runs from the workflow's own core checkout
      # (`_tooling`, req-tap-plugin-extdev-repo-ci-9) — the checks this workflow advertises
      # are the ones that run, whatever core the plugin's floor points at. The one fact
      # that belongs to the harness — its version, for the requires_tap floor — is read
      # off `_harness` and passed in. (Review finding on PR# 373 - tap: running the
      # validator from the floor harness would have made a new check invisible until the
      # floor caught up with it.)
      - name: Validate plugin (structure, strict)
        env:
          PYTHONPATH: ${{ github.workspace }}/_tooling
          BOOT_PROFILE_PATH: ${{ inputs.boot_profile }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        run: |
          # `--project _tooling` gives uv the pyproject's requires-python (>=3.14 — core
          # uses PEP 758 syntax an older interpreter cannot even import) and the synced
          # ci-tooling venv; `--frozen --no-sync` means the lockfile as checked out, nothing
          # resolved or installed here.
          #
          # FAIL-CLOSED on the CI record (req-boot-bootstrap-ci-record-6): --strict turns
          # the validator's "no tap_plugin/<slug>/boot/ci.boot.json" warning into a
          # failure, so a plugin whose suite would run in no lane is refused HERE, in
          # the job everyone runs, instead of silently skipping boot-and-test. The
          # deprecated `boot_profile` input names the retired repo-root record; it is
          # handed to the validator as --ci-record so a plugin mid-migration is held
          # to the same content rules and stays green until it ships the in-package one.
          legacy=""
          if [ -n "$BOOT_PROFILE_PATH" ]; then
            legacy="--ci-record ${{ github.workspace }}/plugin/$BOOT_PROFILE_PATH"
            echo "::warning::boot_profile is deprecated (req-boot-bootstrap-ci-record-2) — ship tap_plugin/$PLUGIN_SLUG/boot/ci.boot.json and drop the input"
          fi
          harness_version=$(awk '/^\[project\]$/{f=1} f&&/^version = /{print $3; exit}' _harness/pyproject.toml | tr -d '"')
          [ -n "$harness_version" ] || { echo "::error::cannot read [project].version from _harness/pyproject.toml"; exit 1; }
          echo "harness core version: $harness_version"
          set -o pipefail
          uv run --project _tooling --frozen --no-sync --no-build \
            python -m tap_plugins.validate_plugin \
            "${{ github.workspace }}/plugin/${{ inputs.plugin_subdir }}" --strict --core-version "$harness_version" $legacy \
            2>&1 | tee validate.log

      # `ci` is a RESERVED record name (req-boot-bootstrap-ci-record): a plugin ships
      # the stack its own tests run in, in-package and hash-covered, at a path fully
      # derivable from the slug. Nothing to configure per repo — shipping the record
      # IS the opt-in. This step only REPORTS presence for the boot-and-test `if:`;
      # the policy (present, declared, coherent — or fail) is the validator's above.
      - name: Detect the in-package CI record
        id: ci_record
        env:
          # Caller-supplied values reach the shell as env, never spliced into the
          # script text: an input containing shell metacharacters is then data, not
          # code. (The surrounding workflow predates this habit; new steps adopt it.)
          PLUGIN_SUBDIR: ${{ inputs.plugin_subdir }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          record="$WORKSPACE/plugin/$PLUGIN_SUBDIR/tap_plugin/$PLUGIN_SLUG/boot/ci.boot.json"
          if [ -f "$record" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ships the conventional CI record — boot-and-test will run"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no tap_plugin/$PLUGIN_SLUG/boot/ci.boot.json — the validator above only lets this pass on the deprecated boot_profile road (req-boot-bootstrap-ci-record-6)"
          fi

      # The summary is the evidence (req-tap-plugin-extdev-repo-ci-8): which core, from
      # where, which plugin commit — legible without opening a log.
      - name: Summary
        env:
          HARNESS_SHA: ${{ steps.harness.outputs.ref }}
          HARNESS_SOURCE: ${{ steps.harness.outputs.source }}
          HARNESS_FLOOR: ${{ steps.harness.outputs.floor }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          HAS_RECORD: ${{ steps.ci_record.outputs.present }}
        run: |
          plugin_sha=$(git -C plugin rev-parse HEAD)
          {
            echo "### conformance — $PLUGIN_SLUG"
            echo "| what | value |"
            echo "| --- | --- |"
            echo "| core harness | \`$HARNESS_SHA\` (${HARNESS_SOURCE}${HARNESS_FLOOR:+, floor $HARNESS_FLOOR}) |"
            echo "| plugin | \`$plugin_sha\` |"
            echo "| in-package ci record | $HAS_RECORD |"
            # The FIPS posture the validator derived with the boot gate's own classifier
            # (req-fips-crypto-bom-conformance-6): what it found, what the ci record waives,
            # what it could not observe here, and whether the ci stack boots or aborts.
            posture=$(grep -o 'fips-posture: {.*}' validate.log 2>/dev/null | tail -1 | sed 's/^fips-posture: //')
            echo "| fips posture | \`${posture:-not reported}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Boot + test — opt-in. Boots the caller's profile in a real stack and runs the
  # plugin's shipped in-package tests (loads/runs conformance). Mirrors the
  # product-lines.yml boot idiom (COMPOSE_FILE overlay, health gate, TAP-ABORT).
  # ---------------------------------------------------------------------------
  boot-and-test:
    # Two roads in: the conventional in-package `ci` record (preferred — nothing to
    # configure), or an explicit `boot_profile` path (the legacy repo-root
    # `ci/nightly.boot.json` form, retired by req-boot-bootstrap-ci-record-2 and kept
    # only until every plugin repo ships a `ci` record — tap#365). Since conformance
    # fails closed without one of the two, this job now runs for every plugin that
    # reaches it; `needs` also means a plugin that fails structure validation does not
    # burn a 25-minute boot to fail again.
    needs: conformance
    if: ${{ inputs.boot_profile != '' || needs.conformance.outputs.has_ci_record == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.boot_and_test_timeout_minutes }}
    # Restated at job level, not inherited: this is the job that builds and RUNS
    # PR-controlled plugin code, so its grant should be legible right here rather
    # than read off the top of the file.
    permissions:
      contents: read
    outputs:
      # Set once the closure document is uploaded, so the scan runs even when a later step
      # (the tests) fails — the closure's state is worth knowing on a red run too.
      closure_ready: ${{ steps.closure.outputs.ready }}
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - name: Checkout core harness (${{ inputs.harness_repo }}@${{ needs.conformance.outputs.harness_sha }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.harness_repo }}
          # The SHA conformance resolved from the plugin's floor (or the override) — the
          # same core in both jobs, by construction (req-tap-plugin-extdev-repo-ci-7).
          ref: ${{ needs.conformance.outputs.harness_sha }}
          token: ${{ secrets.harness_pat || github.token }}
          # See the conformance job: the credential must not survive into a job that
          # executes plugin code. This job is the one that actually runs it.
          persist-credentials: false

      # Checked out INTO the harness tree so the image build context (the core dir)
      # carries it, at `_dev-plugins/<slug>` — the directory `tap.dev_workspace`
      # already owns for an editable plugin checkout. Putting it there means the
      # derivation below finds an existing checkout and reuses it (`clone_editable`
      # returns early), so CI and a developer's `spawn --dev-plugins` reach an
      # identical tree by the identical mechanism.
      - name: Checkout plugin into the harness tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.plugin_repo || github.repository }}
          persist-credentials: false
          path: _dev-plugins/${{ inputs.plugin_slug }}

      # tap.dev_workspace (and the stage-0 modules it imports) are py3.14 code —
      # PEP 758 bare multi-except, which black's py314 target actively enforces —
      # and this step runs them on the HOST, outside the container. The runner's
      # system python is older and dies with "multiple exception types must be
      # parenthesized" before anything boots. Same constraint, same fix as the
      # core `rids` job: resolve the interpreter from the requires-python that
      # governs the container build, so the runner can never drift from it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Stage the boot profile and derive the editable workspace
        env:
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          PLUGIN_SUBDIR: ${{ inputs.plugin_subdir }}
          BOOT_PROFILE_PATH: ${{ inputs.boot_profile }}
        run: |
          set -euo pipefail
          plugin="_dev-plugins/$PLUGIN_SLUG"

          # Compat alias for the RETIRED repo-root profile form, whose records bake
          # `{"type": "editable", "path": "_external/<slug>"}` into themselves — the
          # exact consumer-path coupling req-boot-bootstrap-ci-record-4 forbids. One
          # checkout, two names, both roads work. Drop the alias (and the
          # `boot_profile` input) once samsite + aws_core ship `ci` records.
          mkdir -p _external
          ln -sfn "../$plugin" "_external/$PLUGIN_SLUG"

          if [ -n "$BOOT_PROFILE_PATH" ]; then
            src="$plugin/$BOOT_PROFILE_PATH"
            [ -f "$src" ] || { echo "::error::boot_profile not found in the plugin repo: $BOOT_PROFILE_PATH"; exit 1; }
            echo "staging the explicit boot_profile (legacy form): $BOOT_PROFILE_PATH"
          else
            src="$plugin/$PLUGIN_SUBDIR/tap_plugin/$PLUGIN_SLUG/boot/ci.boot.json"
            [ -f "$src" ] || { echo "::error::no in-package ci record at $src"; exit 1; }
            echo "staging the in-package CI record (req-boot-bootstrap-ci-record)"
          fi
          mkdir -p boot
          cp "$src" "boot/_ext_ci.boot.json"

          # Flip the plugin under test from its pinned git source to the checkout —
          # the SAME derivation `spawn --dev-plugins` runs, so the record never has to
          # know a consumer's directory layout (req-boot-bootstrap-ci-record-4). It is
          # also the enumerate-first install-credential preflight
          # (req-tap-plugin-arch-source-secret-7): a CI record is required to be
          # credential-free, and this is where a record that is not says so, in one
          # verdict, before any image build. A legacy record already declaring the
          # plugin `editable` is a no-op here — the derivation leaves it alone — so
          # both roads converge on one profile id.
          python3 -m tap.dev_workspace \
            --base-profile _ext_ci \
            --dev-plugins "$PLUGIN_SLUG" \
            --worktree .

      - name: Prepare secrets root
        run: |
          rm -f tap_secrets
          mkdir -p tap_secrets/tap_plugins

      # If the profile git-installs private sibling plugins, wire the read-only PAT
      # inline (github_pat kind, data.token) — the free-runner path, distinct from the
      # internal CodeBuild AWS-Secrets-Manager routing.
      #
      # The skip is decided in SHELL, not in a step-level `if:`. The `secrets` context
      # is NOT available to `if:` (allowed there: github/needs/env/inputs/steps/...), and
      # referencing it is a workflow-PARSE error — "Unrecognized named-value: 'secrets'".
      # That is fatal to the whole FILE, not just this step: GitHub then cannot compile
      # the workflow at all, so it registers it by path instead of `name:` and emits a
      # jobless failed run on every push. This workflow had never once compiled because
      # of exactly that. Read the secret into `env` (where `secrets` IS legal) and test
      # the env var instead.
      - name: Wire read-only plugins PAT
        env:
          PLUGINS_RO_PAT: ${{ secrets.plugins_ro_pat }}
        run: |
          if [ -z "$PLUGINS_RO_PAT" ]; then
            echo "No plugins_ro_pat supplied — skipping (the profile must not git-install private siblings)."
            exit 0
          fi
          cat > tap_secrets/tap_plugins/github-plugins-ro.secret.json <<JSON
          {
            "scope": "tap_plugins.source",
            "key": "github-plugins-ro",
            "kind": "github_pat",
            "description": "Read-only GitHub PAT for git-installing private sibling plugins in per-repo CI.",
            "data": { "token": "${PLUGINS_RO_PAT}" },
            "metadata": {}
          }
          JSON

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build web image (GHA layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: tap-web:ci
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/unified-systems-com/tap-web:buildcache-amd64
          cache-to: type=gha,mode=max


      # This lane BUILDS the web image, so it is running the one that declares
      # `USER nonroot`. The container writes into the `.:/app` bind mount and the uv-cache
      # host bind, and on Linux those writes are refused unless the container uid owns the
      # path. Compose defaults the override to EMPTY on purpose, so stacks pulling the older
      # published image still work; a lane on a freshly-built image has to opt in.
      # See req-tap-serving-unprivileged.
      - name: Align the container uid with the runner (built image runs as nonroot)
        run: |
          # Fail closed if the runner is uid 0. Compose `user:` overrides the image
          # USER, so TAP_USER=0:0 would hand the web container back the root this
          # PR removes — and these lanes call compose directly, not through
          # scripts/dc, so its refusal never sees them. GitHub-hosted ubuntu-*
          # runners are uid 1001 (verified), but that is a property of the runner
          # image, not of this file. Raised by the Grok seat on PR# 759 - tap.
          uid="$(id -u)"
          if [ "$uid" -eq 0 ]; then
            echo "::error::Runner is uid 0; TAP_USER=0:0 would defeat the non-root image. Refusing."
            exit 1
          fi
          echo "TAP_USER=$uid:0" >> "$GITHUB_ENV"

      - name: Boot the plugin profile
        env:
          # The DERIVED profile (`<base>__dev`) — the plugin under test swapped for the
          # checkout. Both roads in produce this same id.
          TAP_BOOT_PROFILE: _ext_ci__dev
          TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE: "false"
        run: |
          docker compose --env-file .env up -d
          ok=0
          for i in $(seq 1 90); do
            if docker compose --env-file .env logs web 2>/dev/null | grep -q 'TAP-ABORT:'; then
              echo "::error::boot aborted (TAP-ABORT sentinel in web log)"
              docker compose --env-file .env logs web; exit 1
            fi
            if docker compose --env-file .env exec -T web sh -c 'cd /app && uv run python manage.py health --set readiness' >/dev/null 2>&1; then
              echo "web healthy after ~$((i * 10))s"; ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::web did not become healthy within the timeout"
            docker compose --env-file .env logs web | tail -150; exit 1
          fi

      # The plugin's OWN dependency closure, read from the venv this boot actually resolved
      # (tap#664). A plugin repo has no lockfile — `uv lock` cannot resolve there, and the
      # `[tool.uv.sources]` table that would make it resolve is honoured by `uv pip install`
      # even from a git URL, which would let a plugin author override the operator's profile
      # pins. So the boot is the manifest. The walker is WORKFLOW logic
      # (req-tap-plugin-extdev-repo-ci-9): it comes from this workflow's own commit, not from
      # the harness, whose floor may predate it. Walked BEFORE the plugin's tests run, so the
      # document describes the venv as the boot left it.
      - name: Checkout the walker (${{ inputs.harness_repo }}@${{ job.workflow_sha }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ job.workflow_sha }}
          token: ${{ secrets.harness_pat || github.token }}
          persist-credentials: false
          # Inside the harness tree, which the web container mounts at /app.
          path: .tap-ci-tooling

      # Generated even when the closure is EMPTY — "scanned, nothing in scope" and "never
      # scanned" must not look alike. `cd` into the walker's checkout and put it on
      # PYTHONPATH so `tap` resolves to the workflow's copy, while `--project /app` keeps the
      # booted venv (the thing being described) as the interpreter's site-packages.
      - name: Walk the plugin's own closure (CycloneDX)
        env:
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        run: |
          set -euo pipefail
          docker compose --env-file .env exec -T -e PLUGIN_SLUG="$PLUGIN_SLUG" \
            -e PYTHONPATH=/app/.tap-ci-tooling \
            web sh -c 'cd /app/.tap-ci-tooling && uv run --project /app --no-sync \
              python -m tap.dependency_snapshot --format cyclonedx --slug "$PLUGIN_SLUG"' \
            > dependency-closure.cdx.json
          # Gone before the plugin's tests run: a second copy of core inside the tree /app
          # mounts is nothing those tests (or an after-tests command) should ever see.
          rm -rf .tap-ci-tooling
          # jq, not python3: this runs on the RUNNER, whose system interpreter is older than
          # the repo's (req-dev-localexec-runner-interpreter).
          jq -e '"\(.metadata.component.name): \(.components | length) package(s) in scope"' dependency-closure.cdx.json

      - name: Hand the closure to the scan job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-closure-${{ inputs.plugin_slug }}
          path: dependency-closure.cdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Mark the closure ready
        id: closure
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      # The plugin ships its tests inside the package (tap_plugin/<slug>/tests/), so
      # collect them by import path — travels with the plugin, no path knowledge needed.
      - name: Run the plugin's in-package tests
        env:
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        run: |
          set -o pipefail
          docker compose --env-file .env exec -T web sh -c \
            "cd /app && uv run pytest -p no:cacheprovider --pyargs tap_plugin.$PLUGIN_SLUG" | tee pytest.log

      # Caller-supplied work that needs the booted stack — a fuzz campaign, a corpus-drift
      # scan. Runs only after the in-package tests passed (a campaign over a broken
      # plugin measures nothing), inside the same container, from /app. The command text
      # is the CALLER's own workflow file, reached through an env var — never spliced
      # into this script by expression, and never expanded by the RUNNER's shell either:
      # it crosses into the container as an env var and is evaluated there, by the same
      # sh that runs the plugin's tests. Its rights are exactly those tests' rights — a
      # PR that can edit the caller's workflow can already run arbitrary code in this
      # job through the in-package suite, and both steps' stdout reaches the public job
      # log — so this hook widens no boundary; it reuses the existing one. The two commits
      # this run is about are handed in as TAP_CI_HARNESS_SHA / TAP_CI_PLUGIN_SHA so a
      # ledger row can stamp its provenance (git is not in the image, so the command
      # cannot ask for them itself).
      - name: After-tests command (caller-supplied)
        id: after_tests
        if: ${{ inputs.after_tests_command != '' }}
        env:
          AFTER_TESTS_COMMAND: ${{ inputs.after_tests_command }}
          HARNESS_SHA: ${{ needs.conformance.outputs.harness_sha }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        run: |
          set -o pipefail
          plugin_sha="$(git -C "_dev-plugins/$PLUGIN_SLUG" rev-parse HEAD)"
          docker compose --env-file .env exec -T \
            -e AFTER_TESTS_COMMAND="$AFTER_TESTS_COMMAND" \
            -e TAP_CI_HARNESS_SHA="$HARNESS_SHA" -e TAP_CI_PLUGIN_SHA="$plugin_sha" \
            web sh -c 'cd /app && eval "$AFTER_TESTS_COMMAND"' | tee after-tests.log

      # What the after-tests command produced, for the caller's next job: the harness tree
      # IS the container's /app (bind mount), so a file written in-container is here.
      # CONFINED before upload: the same tree holds the
      # run's `.env` and the secrets root, a caller's workflow file is PR-controlled on
      # that repo's pull requests, and an artifact on a public repo is downloadable by
      # anyone — so only the plugin's own checkout and a dedicated output dir may be
      # staged; absolute paths, `..`, and anything else are refused, loudly.
      - name: Stage the after-tests artifact (confined paths)
        if: ${{ always() && inputs.after_tests_artifact_paths != '' }}
        env:
          ARTIFACT_PATHS: ${{ inputs.after_tests_artifact_paths }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          COMMAND_OUTCOME: ${{ steps.after_tests.outcome }}
        run: |
          set -euo pipefail
          rm -rf after-tests-stage
          mkdir -p after-tests-stage
          # The log goes first, unconditionally: when the command FAILED its log is the
          # one thing the next job needs, and it must not be lost because a declared
          # output was (predictably) never written. (First spin, 2026-09-11: the campaign
          # died in 0.3s and the missing summary took the log down with it.)
          if [ -f after-tests.log ]; then
            cp after-tests.log after-tests-stage/after-tests.log
          fi
          printf '%s\n' "$ARTIFACT_PATHS" | while IFS= read -r raw; do
            p="$(printf '%s' "$raw" | xargs)"
            [ -n "$p" ] || continue
            case "$p" in
              /*|*..*)
                echo "::error::after_tests_artifact_paths: '$p' is absolute or escapes the tree — refused"
                exit 1 ;;
              "_dev-plugins/$PLUGIN_SLUG/"*|"after-tests-out/"*) ;;
              *)
                echo "::error::after_tests_artifact_paths: '$p' is outside _dev-plugins/$PLUGIN_SLUG/ and after-tests-out/ — refused (the harness tree holds this run's .env and secrets root; artifacts are public)"
                exit 1 ;;
            esac
            if [ ! -e "$p" ]; then
              # A declared output missing after a SUCCESSFUL command is a lie in the
              # caller's contract — fail. After a failed command it is expected — say so
              # and keep staging, so the log and whatever else exists still upload.
              if [ "$COMMAND_OUTCOME" = "success" ]; then
                echo "::error::after_tests_artifact_paths: '$p' does not exist although the command succeeded"
                exit 1
              fi
              echo "::warning::after_tests_artifact_paths: '$p' not produced (command outcome: $COMMAND_OUTCOME)"
              continue
            fi
            # The prefix check above is on the STRING. The plugin checkout is PR-controlled
            # and may contain symbolic links; `[ -e ]` follows them and upload-artifact
            # dereferences them, so a link under _dev-plugins/<slug>/ aimed at the
            # harness's .env would pass the prefix and ship the target. Resolve the REAL
            # path, require it inside the allowed roots, refuse any link in the tree, and
            # copy without dereferencing.
            real="$(realpath -e -- "$p")"
            case "$real" in
              "$PWD/_dev-plugins/$PLUGIN_SLUG/"*|"$PWD/after-tests-out/"*) ;;
              *)
                echo "::error::after_tests_artifact_paths: '$p' resolves to '$real', outside the allowed roots (a symbolic link?) — refused"
                exit 1 ;;
            esac
            if [ -L "$p" ] || find "$p" -type l | grep -q .; then
              echo "::error::after_tests_artifact_paths: '$p' is or contains a symbolic link — refused (artifacts are public; links are how a confined path reaches an unconfined one)"
              exit 1
            fi
            mkdir -p "after-tests-stage/$(dirname "$p")"
            cp -R -P -- "$p" "after-tests-stage/$p"
          done
          # Belt and braces: nothing staged may be a link, whatever produced it.
          if find after-tests-stage -type l | grep -q .; then
            echo "::error::after-tests staging contains symbolic links — refused"
            exit 1
          fi
          find after-tests-stage -type f | sed 's/^/staged: /'
      - name: Upload after-tests artifact
        if: ${{ always() && inputs.after_tests_artifact_paths != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: after-tests
          path: after-tests-stage
          if-no-files-found: error
          retention-days: 30

      # The summary is the evidence (req-tap-plugin-extdev-repo-ci-8): the core this ran
      # against, the plugin commit, and how many tests EXECUTED. Zero is red — a green
      # with nothing run is presence-is-not-correctness in lane form (a wrong --pyargs,
      # a package that ships no tests, a collection error swallowed by the shell).
      - name: Summary (fails on zero executed tests)
        if: always()
        env:
          HARNESS_SHA: ${{ needs.conformance.outputs.harness_sha }}
          HARNESS_SOURCE: ${{ needs.conformance.outputs.harness_source }}
          HARNESS_FLOOR: ${{ needs.conformance.outputs.harness_floor }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        run: |
          plugin_sha=$(git -C "_dev-plugins/$PLUGIN_SLUG" rev-parse HEAD)
          executed=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("pytest.log").read_text(errors="replace") if pathlib.Path("pytest.log").is_file() else ""
          tail = text[-4000:]
          counts = {k: int(v) for v, k in re.findall(r"(\d+) (passed|failed|error|errors|xfailed|xpassed)", tail)}
          print(counts.get("passed", 0) + counts.get("failed", 0) + counts.get("error", 0) + counts.get("errors", 0) + counts.get("xfailed", 0) + counts.get("xpassed", 0))
          PY
          )
          {
            echo "### boot-and-test — $PLUGIN_SLUG"
            echo "| what | value |"
            echo "| --- | --- |"
            echo "| core harness | \`$HARNESS_SHA\` (${HARNESS_SOURCE}${HARNESS_FLOOR:+, floor $HARNESS_FLOOR}) |"
            echo "| plugin | \`$plugin_sha\` |"
            echo "| tests executed | $executed |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$executed" = "0" ]; then
            echo "::error::boot-and-test executed 0 tests for tap_plugin.$PLUGIN_SLUG — a green with nothing run is not a green (req-tap-plugin-extdev-repo-ci-8)"
            exit 1
          fi

      - name: Dump web logs on failure
        if: failure()
        run: docker compose --env-file .env logs web | tail -200

  # ---------------------------------------------------------------------------
  # Scan the plugin's own closure (tap#772). Read-only, and no plugin code runs here: the
  # input is the CycloneDX document boot-and-test walked, the waiver ledger is the plugin
  # repo's `.trivyignore` (and nothing else from that checkout), and the classifier and the
  # locator are the workflow's own tooling. Same Trivy pin and flags as core's release gate
  # (`publish-release-tags.yml`), so "fixable HIGH/CRITICAL" means one thing across TAP.
  # ---------------------------------------------------------------------------
  scan-dependencies:
    needs: boot-and-test
    if: ${{ !cancelled() && needs.boot-and-test.outputs.closure_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Receive the closure document
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-closure-${{ inputs.plugin_slug }}

      # The waiver ledger lives at the plugin repository's ROOT and is the only file taken
      # from that checkout. Absent is allowed and means nothing is waived.
      - name: Checkout the plugin's waiver ledger (.trivyignore only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.plugin_repo || github.repository }}
          persist-credentials: false
          path: plugin
          sparse-checkout: .trivyignore
          sparse-checkout-cone-mode: false

      - name: Checkout the workflow's tooling (${{ inputs.harness_repo }}@${{ job.workflow_sha }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ job.workflow_sha }}
          token: ${{ secrets.harness_pat || github.token }}
          persist-credentials: false
          path: _tooling

      # The classifier and the locator are repo Python; run them on the interpreter the repo
      # declares, not on whatever the runner image ships (req-dev-localexec-runner-interpreter).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "_tooling/pyproject.toml"

      # A waiver is an operator's decision and must say why (the discipline of core's own
      # `.trivyignore`): every entry sits directly under a comment giving its reason. An
      # entry without one fails here, before it can quietly pass a finding.
      - name: Waiver ledger — every entry carries a reason
        id: waivers
        run: |
          set -euo pipefail
          if [ -f plugin/.trivyignore ]; then
            python3 _tooling/scripts/release_cve_gate.py --check-waivers plugin/.trivyignore
            echo "ledger=plugin/.trivyignore" >> "$GITHUB_OUTPUT"
          else
            echo "No .trivyignore at the plugin repository's root — nothing is waived."
          fi

      # Two passes over one document. The REPORT pass keeps every severity (what code
      # scanning and the summary show); the GATE pass is the release gate's flags. The
      # action builds SARIF at every severity unless `limit-severities-for-sarif` is set,
      # so the gate pass sets it — without it `severity:` would be ignored and a fixable LOW
      # would fail the run.
      - name: Scan the closure — report (every severity)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: dependency-closure.cdx.json
          format: sarif
          output: trivy-plugin-closure.sarif
          trivyignores: ${{ steps.waivers.outputs.ledger }}
          exit-code: "0"

      - name: Scan the closure — gate (fixable HIGH/CRITICAL)
        id: gate_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: dependency-closure.cdx.json
          format: sarif
          output: trivy-plugin-closure-gate.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: "true"
          # Stated as "false" rather than omitted. The action's default IS false today, so leaving
          # the key out behaves identically — but then the only thing asserting this gate's policy
          # is the ABSENCE of a key, and a pin bump that changed that default would restore
          # `--ignore-unfixed` with every test still green. That is the same "the flag moved and
          # the sentence did not" failure this very step already suffered once. An explicit value
          # is a thing a test can hold.
          ignore-unfixed: "false"
          # The divergence itself is deliberate from the RELEASE gate
          # (publish-release-tags.yml), which keeps it (ruling George, 2026-09-17,
          # req-cicd-base-image-lifecycle-2). The release gate scans a base-image closure — OS
          # packages we do not pick, cannot patch and cannot drop, where "no fix available"
          # genuinely means no lever exists; zlib CVE-2026-85091 (tap#491) would otherwise refuse
          # every release forever. This gate scans a plugin's OWN Python closure: packages we
          # chose, where an unfixable HIGH almost always still has a lever — pin around it, drop
          # it, swap it. `--ignore-unfixed` is exactly the flag that stops anyone having to
          # consider one. So an unwaived HIGH/CRITICAL blocks here whether or not a fix exists:
          # ship a fix, a workaround, or a `.trivyignore` entry carrying its reason. Ruling
          # George, 2026-09-26 (Q94d/Q94e); held by tap/tests/test_plugin_ci_workflow.py.
          trivyignores: ${{ steps.waivers.outputs.ledger }}
          exit-code: "1"
          skip-setup-trivy: "true"

      # Trivy names each SBOM result's location after its scan target ("Python"), which is no
      # file; Code Scanning needs one (tap#294). The plugin's pyproject.toml is where its
      # dependencies are declared and where a bump lands.
      - name: Locate every finding on the plugin's pyproject.toml
        env:
          PLUGIN_SUBDIR: ${{ inputs.plugin_subdir }}
        run: python3 _tooling/scripts/sbom/sarif_locate.py --plugin-subdir "$PLUGIN_SUBDIR"

      - name: Summary (every finding, always)
        if: always()
        env:
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          LEDGER: ${{ steps.waivers.outputs.ledger }}
        run: |
          packages="$(jq '.components | length' dependency-closure.cdx.json)"
          {
            echo "### dependency closure — $PLUGIN_SLUG"
            echo "Trivy scanned **$packages** package(s): the plugin's own closure, stopping at sibling plugins."
            echo "Gate: ANY HIGH/CRITICAL — with or without a fix available (Q94d) — fails the run unless waived in \`.trivyignore\` (${LEDGER:-none present})."
            echo
            python3 _tooling/scripts/release_cve_gate.py --markdown --report trivy-plugin-closure.sarif
          } >> "$GITHUB_STEP_SUMMARY"

      # Trivy's exit code cannot separate "found something" from "could not look"; the
      # classifier does, and names the ids either way. Both fail the run.
      - name: Gate — fixable HIGH/CRITICAL, or a scan that did not happen (fail-closed)
        env:
          OUTCOME: ${{ steps.gate_scan.outcome }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        run: |
          set +e
          python3 _tooling/scripts/release_cve_gate.py --gate plugin-closure \
            --report trivy-plugin-closure-gate.sarif --scanner-outcome "$OUTCOME" --subject "$PLUGIN_SLUG" \
            > gate.log 2>&1
          rc=$?
          set -e
          cat gate.log
          { echo; echo "**Gate verdict:**"; echo '```text'; sed 's/^::error:://' gate.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Hand the report to the upload job
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-plugin-closure-${{ inputs.plugin_slug }}
          path: trivy-plugin-closure.sarif
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Upload the report to the plugin repo's code scanning. The ONLY job in this workflow
  # with a write scope, and that scope is `security-events: write`: it receives a file and
  # hands it to a first-party action — no checkout, no plugin code, no third-party action.
  # Its `if:` never lets it run for a pull request or a cross-repo caller, but GitHub still
  # validates its grant at startup, which is why every caller grants the scope (header).
  # ---------------------------------------------------------------------------
  upload-dependency-sarif:
    needs: scan-dependencies
    # Each condition is load-bearing:
    #   * the scan reached a verdict (success or failure) — a red gate still publishes its
    #     findings, which is when they matter most;
    #   * plugin_repo == '' — the CALLER is the plugin repo. Core's nightly matrix calls this
    #     workflow cross-repo, where `github.repository` is CORE; uploading there would file
    #     every plugin's findings against core;
    #   * a schedule (which runs on the default branch), or a push to the default branch —
    #     never a pull request, whose findings are a proposal's, not the branch's.
    # An expression that cannot resolve compares unequal and SKIPS: the safe direction is
    # not uploading, never uploading wrongly.
    if: >-
      ${{ !cancelled()
          && (needs.scan-dependencies.result == 'success' || needs.scan-dependencies.result == 'failure')
          && inputs.plugin_repo == ''
          && (github.event_name == 'schedule'
              || (github.event_name == 'push'
                  && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: Receive the located report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: trivy-plugin-closure-${{ inputs.plugin_slug }}

      - name: Upload SARIF to code scanning
        if: steps.report.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-plugin-closure.sarif
          category: tap-plugin-closure
