# Reusable per-plugin CI (req-tap-plugin-extdev-repo-ci, spec-tap-plugin-external-development.md).
#
# The CI an EXTERNAL plugin repository runs against a KNOWN-GOOD core on free generic
# runners. A plugin repo's own workflow is a thin caller:
#
#   jobs:
#     tap:
#       uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@v1
#       with:
#         plugin_slug: my_plugin
#         harness_ref: v0.2.0          # pin the core harness — reproducible, known-good
#         boot_profile: ci/my.boot.json  # optional: boot + run the plugin's tests
#       secrets:
#         harness_pat:    ${{ secrets.TAP_CORE_RO_PAT }}      # read core (private)
#         plugins_ro_pat: ${{ secrets.TAP_PLUGINS_RO_PAT }}   # git-install private siblings
#
# Reciprocal of all-plugins.yml: that lane owns FULL-SET truth from the monorepo; this
# lane owns ONE external plugin against a pinned core. It never runs the heavy gryphon
# corpus — that is the internal CodeBuild integration path, never external.
#
# Two jobs:
#   conformance   — always. `validate_plugin --strict` (structure level, Django-free) against
#                   the pinned harness. Fast, no image, no DB. THE admission gate.
#   boot-and-test — opt-in (a `boot_profile` was passed). Boots the caller's profile in a real
#                   compose stack and runs the plugin's in-package tests (loads/runs coverage).
#
# STATUS: In Development — conformance fails closed without a `ci` record and the harness
# is the plugin's declared floor (tap#365, 2026-09-09); boot-and-test's summary + zero-test
# red await their first observation on a plugin PR.

name: tap-plugin-ci

on:
  workflow_call:
    inputs:
      plugin_slug:
        description: "The plugin slug (== manifest slug == tap_plugin.<slug> namespace)."
        required: true
        type: string
      plugin_repo:
        description: >-
          The plugin repository to test. Empty (the default) means the CALLER repo —
          the per-plugin-repo CI case. Core's nightly matrix passes each discovered
          tap-plugin-* repo explicitly; without this, a cross-repo caller would check
          out ITSELF as the plugin (core validating core-as-a-plugin — a false red).
        required: false
        type: string
        default: ""
      harness_repo:
        description: "The core TAP repo used as the dev harness."
        required: false
        type: string
        default: unified-systems-com/tap
      harness_ref:
        description: >-
          OVERRIDE ONLY. Empty (the default) means the harness is the plugin's declared
          floor: core at the tag v<lower bound of requires_tap>, resolved to a SHA by
          tap.ci_harness (req-tap-plugin-extdev-repo-ci-7) — a harness above the floor does
          not prove the floor. Set it for the nightly (`main`: a compatibility forecast, a
          different question) or a one-off debug run; never as a PR default.
        required: false
        type: string
        default: ""
      plugin_subdir:
        description: "Path to the plugin ROOT within the caller repo (holds pyproject.toml + tap_plugin/<slug>/)."
        required: false
        type: string
        default: "."
      boot_profile:
        description: >-
          DEPRECATED (req-boot-bootstrap-ci-record-2): path within the caller repo to the
          retired repo-root CI record. Ship tap_plugin/<slug>/boot/ci.boot.json instead;
          without either, conformance fails closed.
        required: false
        type: string
        default: ""
    secrets:
      harness_pat:
        description: "Token with read access to the (private) core repo. Defaults to the caller's GITHUB_TOKEN."
        required: false
      plugins_ro_pat:
        description: "Read-only GitHub PAT for git-installing private sibling plugins during boot."
        required: false

# Least-privilege GITHUB_TOKEN: both jobs only check out + build (no registry push,
# no artifact/SARIF upload). For cross-repo callers this can only narrow, never widen,
# the caller's own grant.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Conformance — the always-on admission gate. Django-free structure validation
  # against the pinned harness, on a bare runner (no image, no DB). Fast.
  # ---------------------------------------------------------------------------
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Whether the plugin ships the conventional in-package CI record. Emitted from
      # HERE because `if:` on a job cannot see repository contents, and this job has
      # the plugin checked out already — no extra job, no extra checkout.
      has_ci_record: ${{ steps.ci_record.outputs.present }}
      # The ONE core commit this run is about (req-tap-plugin-extdev-repo-ci-2/-7):
      # resolved once here, consumed by boot-and-test, printed in both summaries.
      harness_sha: ${{ steps.harness.outputs.ref }}
      harness_source: ${{ steps.harness.outputs.source }}
      harness_floor: ${{ steps.harness.outputs.floor }}
    steps:
      - name: Checkout plugin (${{ inputs.plugin_repo || github.repository }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.plugin_repo || github.repository }}
          persist-credentials: false
          path: plugin

      # Two pins, independent (req-tap-plugin-extdev-repo-ci-9): the caller pins THIS
      # workflow (`plugin-ci.yml@<sha>` — which validation logic runs); the plugin's
      # manifest pins the HARNESS (`requires_tap` — which core it runs against). The
      # resolver is tooling that belongs to the workflow, so it is checked out at the
      # workflow's own commit, before any harness exists.
      # `job.workflow_sha` is the commit of the file that defines THIS job — the reusable
      # workflow's, when the job comes from one. `github.workflow_sha` is the CALLER's
      # (observed 2026-09-09 on tap-plugin-identity-core PR# 3: "not our ref").
      - name: Checkout the workflow's tooling (${{ inputs.harness_repo }}@${{ job.workflow_sha }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ job.workflow_sha }}
          token: ${{ secrets.harness_pat || github.token }}
          persist-credentials: false
          path: _tooling

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The floor decides the harness (req-tap-plugin-extdev-repo-ci-7): core at the tag
      # v<lower bound of requires_tap>, resolved to a SHA. No floor, or a floor that is
      # not a released core, fails HERE with the reason. `harness_ref` is the override.
      - name: Resolve the core harness from the plugin's floor
        id: harness
        env:
          PYTHONPATH: ${{ github.workspace }}/_tooling
          MANIFEST: ${{ github.workspace }}/plugin/${{ inputs.plugin_subdir }}/tap_plugin/${{ inputs.plugin_slug }}/tap-plugin.toml
          HARNESS_REPO: ${{ inputs.harness_repo }}
          HARNESS_OVERRIDE: ${{ inputs.harness_ref }}
        run: |
          # Locked to the tooling's own uv.lock (derive the pin, never restate it) and
          # --no-build: nothing from the index may run a setup script on this runner.
          packaging=$(awk '/^name = "packaging"$/{f=1} f&&/^version = /{print $3; exit}' _tooling/uv.lock | tr -d '"')
          uv run --python 3.14 --no-project --no-build --with "packaging==$packaging" \
            python -m tap.ci_harness --manifest "$MANIFEST" --repo "$HARNESS_REPO" --override "$HARNESS_OVERRIDE"

      - name: Checkout core harness (${{ inputs.harness_repo }}@${{ steps.harness.outputs.ref }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ steps.harness.outputs.ref }}
          token: ${{ secrets.harness_pat || github.token }}
          # The token is needed to FETCH and for nothing after. Left persisted it is
          # written into .git/config, and this workflow's whole point is to then build
          # and execute PR-controlled plugin code — build hooks and tests — which could
          # read it back out. Nothing here pushes (req-sec-cheap-edges).
          persist-credentials: false
          path: _harness

      # Structure-level validation needs only pure-python core modules
      # (tap_plugins.manifest / tap.core_version / tap.plugin_deps / tap.jsonfiles),
      # so run it with core on PYTHONPATH + just jsonschema + packaging — no full
      # core `uv sync`, no Django. The pinned harness IS the version requires_tap
      # is checked against, so this also enforces the compatibility floor.
      # The validator is WORKFLOW logic, so it runs from the workflow's own core checkout
      # (`_tooling`, req-tap-plugin-extdev-repo-ci-9) — the checks this workflow advertises
      # are the ones that run, whatever core the plugin's floor points at. The one fact
      # that belongs to the harness — its version, for the requires_tap floor — is read
      # off `_harness` and passed in. (Review finding on PR# 373 - tap: running the
      # validator from the floor harness would have made a new check invisible until the
      # floor caught up with it.)
      - name: Validate plugin (structure, strict)
        env:
          PYTHONPATH: ${{ github.workspace }}/_tooling
          BOOT_PROFILE_PATH: ${{ inputs.boot_profile }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        run: |
          # --python is REQUIRED, not a nicety. With --no-project there is no
          # pyproject for uv to read requires-python from, so it silently uses
          # whatever python the runner ships (3.12 on ubuntu-latest today) rather
          # than the >=3.14 core actually needs. Core uses PEP 758 syntax
          # (`except A, B:` unparenthesized, 3.14+), so an older interpreter fails
          # with a SyntaxError while merely IMPORTING the validator — which reads
          # like the plugin is malformed when nothing is wrong with the plugin at
          # all. uv fetches the interpreter if the runner lacks it.
          #
          # FAIL-CLOSED on the CI record (req-boot-bootstrap-ci-record-6): --strict turns
          # the validator's "no tap_plugin/<slug>/boot/ci.boot.json" warning into a
          # failure, so a plugin whose suite would run in no lane is refused HERE, in
          # the job everyone runs, instead of silently skipping boot-and-test. The
          # deprecated `boot_profile` input names the retired repo-root record; it is
          # handed to the validator as --ci-record so a plugin mid-migration is held
          # to the same content rules and stays green until it ships the in-package one.
          legacy=""
          if [ -n "$BOOT_PROFILE_PATH" ]; then
            legacy="--ci-record ${{ github.workspace }}/plugin/$BOOT_PROFILE_PATH"
            echo "::warning::boot_profile is deprecated (req-boot-bootstrap-ci-record-2) — ship tap_plugin/$PLUGIN_SLUG/boot/ci.boot.json and drop the input"
          fi
          # Same discipline as the resolver step: versions from the tooling's uv.lock, --no-build.
          packaging=$(awk '/^name = "packaging"$/{f=1} f&&/^version = /{print $3; exit}' _tooling/uv.lock | tr -d '"')
          jsonschema=$(awk '/^name = "jsonschema"$/{f=1} f&&/^version = /{print $3; exit}' _tooling/uv.lock | tr -d '"')
          harness_version=$(awk '/^\[project\]$/{f=1} f&&/^version = /{print $3; exit}' _harness/pyproject.toml | tr -d '"')
          [ -n "$harness_version" ] || { echo "::error::cannot read [project].version from _harness/pyproject.toml"; exit 1; }
          echo "harness core version: $harness_version"
          uv run --python 3.14 --no-project --no-build --with "jsonschema==$jsonschema" --with "packaging==$packaging" \
            python -m tap_plugins.validate_plugin \
            "${{ github.workspace }}/plugin/${{ inputs.plugin_subdir }}" --strict --core-version "$harness_version" $legacy

      # `ci` is a RESERVED record name (req-boot-bootstrap-ci-record): a plugin ships
      # the stack its own tests run in, in-package and hash-covered, at a path fully
      # derivable from the slug. Nothing to configure per repo — shipping the record
      # IS the opt-in. This step only REPORTS presence for the boot-and-test `if:`;
      # the policy (present, declared, coherent — or fail) is the validator's above.
      - name: Detect the in-package CI record
        id: ci_record
        env:
          # Caller-supplied values reach the shell as env, never spliced into the
          # script text: an input containing shell metacharacters is then data, not
          # code. (The surrounding workflow predates this habit; new steps adopt it.)
          PLUGIN_SUBDIR: ${{ inputs.plugin_subdir }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          record="$WORKSPACE/plugin/$PLUGIN_SUBDIR/tap_plugin/$PLUGIN_SLUG/boot/ci.boot.json"
          if [ -f "$record" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ships the conventional CI record — boot-and-test will run"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no tap_plugin/$PLUGIN_SLUG/boot/ci.boot.json — the validator above only lets this pass on the deprecated boot_profile road (req-boot-bootstrap-ci-record-6)"
          fi

      # The summary is the evidence (req-tap-plugin-extdev-repo-ci-8): which core, from
      # where, which plugin commit — legible without opening a log.
      - name: Summary
        env:
          HARNESS_SHA: ${{ steps.harness.outputs.ref }}
          HARNESS_SOURCE: ${{ steps.harness.outputs.source }}
          HARNESS_FLOOR: ${{ steps.harness.outputs.floor }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          HAS_RECORD: ${{ steps.ci_record.outputs.present }}
        run: |
          plugin_sha=$(git -C plugin rev-parse HEAD)
          {
            echo "### conformance — $PLUGIN_SLUG"
            echo "| what | value |"
            echo "| --- | --- |"
            echo "| core harness | \`$HARNESS_SHA\` (${HARNESS_SOURCE}${HARNESS_FLOOR:+, floor $HARNESS_FLOOR}) |"
            echo "| plugin | \`$plugin_sha\` |"
            echo "| in-package ci record | $HAS_RECORD |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Boot + test — opt-in. Boots the caller's profile in a real stack and runs the
  # plugin's shipped in-package tests (loads/runs conformance). Mirrors the
  # all-plugins.yml boot idiom (COMPOSE_FILE overlay, health gate, TAP-ABORT).
  # ---------------------------------------------------------------------------
  boot-and-test:
    # Two roads in: the conventional in-package `ci` record (preferred — nothing to
    # configure), or an explicit `boot_profile` path (the legacy repo-root
    # `ci/nightly.boot.json` form, retired by req-boot-bootstrap-ci-record-2 and kept
    # only until every plugin repo ships a `ci` record — tap#365). Since conformance
    # fails closed without one of the two, this job now runs for every plugin that
    # reaches it; `needs` also means a plugin that fails structure validation does not
    # burn a 25-minute boot to fail again.
    needs: conformance
    if: ${{ inputs.boot_profile != '' || needs.conformance.outputs.has_ci_record == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Restated at job level, not inherited: this is the job that builds and RUNS
    # PR-controlled plugin code, so its grant should be legible right here rather
    # than read off the top of the file.
    permissions:
      contents: read
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - name: Checkout core harness (${{ inputs.harness_repo }}@${{ needs.conformance.outputs.harness_sha }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.harness_repo }}
          # The SHA conformance resolved from the plugin's floor (or the override) — the
          # same core in both jobs, by construction (req-tap-plugin-extdev-repo-ci-7).
          ref: ${{ needs.conformance.outputs.harness_sha }}
          token: ${{ secrets.harness_pat || github.token }}
          # See the conformance job: the credential must not survive into a job that
          # executes plugin code. This job is the one that actually runs it.
          persist-credentials: false

      # Checked out INTO the harness tree so the image build context (the core dir)
      # carries it, at `_dev-plugins/<slug>` — the directory `tap.dev_workspace`
      # already owns for an editable plugin checkout. Putting it there means the
      # derivation below finds an existing checkout and reuses it (`clone_editable`
      # returns early), so CI and a developer's `spawn --dev-plugins` reach an
      # identical tree by the identical mechanism.
      - name: Checkout plugin into the harness tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.plugin_repo || github.repository }}
          persist-credentials: false
          path: _dev-plugins/${{ inputs.plugin_slug }}

      # tap.dev_workspace (and the stage-0 modules it imports) are py3.14 code —
      # PEP 758 bare multi-except, which black's py314 target actively enforces —
      # and this step runs them on the HOST, outside the container. The runner's
      # system python is older and dies with "multiple exception types must be
      # parenthesized" before anything boots. Same constraint, same fix as the
      # core `rids` job: resolve the interpreter from the requires-python that
      # governs the container build, so the runner can never drift from it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Stage the boot profile and derive the editable workspace
        env:
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          PLUGIN_SUBDIR: ${{ inputs.plugin_subdir }}
          BOOT_PROFILE_PATH: ${{ inputs.boot_profile }}
        run: |
          set -euo pipefail
          plugin="_dev-plugins/$PLUGIN_SLUG"

          # Compat alias for the RETIRED repo-root profile form, whose records bake
          # `{"type": "editable", "path": "_external/<slug>"}` into themselves — the
          # exact consumer-path coupling req-boot-bootstrap-ci-record-4 forbids. One
          # checkout, two names, both roads work. Drop the alias (and the
          # `boot_profile` input) once samsite + aws_core ship `ci` records.
          mkdir -p _external
          ln -sfn "../$plugin" "_external/$PLUGIN_SLUG"

          if [ -n "$BOOT_PROFILE_PATH" ]; then
            src="$plugin/$BOOT_PROFILE_PATH"
            [ -f "$src" ] || { echo "::error::boot_profile not found in the plugin repo: $BOOT_PROFILE_PATH"; exit 1; }
            echo "staging the explicit boot_profile (legacy form): $BOOT_PROFILE_PATH"
          else
            src="$plugin/$PLUGIN_SUBDIR/tap_plugin/$PLUGIN_SLUG/boot/ci.boot.json"
            [ -f "$src" ] || { echo "::error::no in-package ci record at $src"; exit 1; }
            echo "staging the in-package CI record (req-boot-bootstrap-ci-record)"
          fi
          mkdir -p boot
          cp "$src" "boot/_ext_ci.boot.json"

          # Flip the plugin under test from its pinned git source to the checkout —
          # the SAME derivation `spawn --dev-plugins` runs, so the record never has to
          # know a consumer's directory layout (req-boot-bootstrap-ci-record-4). It is
          # also the enumerate-first install-credential preflight
          # (req-tap-plugin-arch-source-secret-7): a CI record is required to be
          # credential-free, and this is where a record that is not says so, in one
          # verdict, before any image build. A legacy record already declaring the
          # plugin `editable` is a no-op here — the derivation leaves it alone — so
          # both roads converge on one profile id.
          python3 -m tap.dev_workspace \
            --base-profile _ext_ci \
            --dev-plugins "$PLUGIN_SLUG" \
            --worktree .

      - name: Prepare secrets root
        run: |
          rm -f tap_secrets
          mkdir -p tap_secrets/tap_plugins

      # If the profile git-installs private sibling plugins, wire the read-only PAT
      # inline (github_pat kind, data.token) — the free-runner path, distinct from the
      # internal CodeBuild AWS-Secrets-Manager routing.
      #
      # The skip is decided in SHELL, not in a step-level `if:`. The `secrets` context
      # is NOT available to `if:` (allowed there: github/needs/env/inputs/steps/...), and
      # referencing it is a workflow-PARSE error — "Unrecognized named-value: 'secrets'".
      # That is fatal to the whole FILE, not just this step: GitHub then cannot compile
      # the workflow at all, so it registers it by path instead of `name:` and emits a
      # jobless failed run on every push. This workflow had never once compiled because
      # of exactly that. Read the secret into `env` (where `secrets` IS legal) and test
      # the env var instead.
      - name: Wire read-only plugins PAT
        env:
          PLUGINS_RO_PAT: ${{ secrets.plugins_ro_pat }}
        run: |
          if [ -z "$PLUGINS_RO_PAT" ]; then
            echo "No plugins_ro_pat supplied — skipping (the profile must not git-install private siblings)."
            exit 0
          fi
          cat > tap_secrets/tap_plugins/github-plugins-ro.secret.json <<JSON
          {
            "scope": "tap_plugins.source",
            "key": "github-plugins-ro",
            "kind": "github_pat",
            "description": "Read-only GitHub PAT for git-installing private sibling plugins in per-repo CI.",
            "data": { "token": "${PLUGINS_RO_PAT}" },
            "metadata": {}
          }
          JSON

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build web image (GHA layer cache)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: tap-web:ci
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/unified-systems-com/tap-web:buildcache-amd64
          cache-to: type=gha,mode=max

      - name: Boot the plugin profile
        env:
          # The DERIVED profile (`<base>__dev`) — the plugin under test swapped for the
          # checkout. Both roads in produce this same id.
          TAP_BOOT_PROFILE: _ext_ci__dev
          TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE: "false"
        run: |
          docker compose --env-file .env up -d
          ok=0
          for i in $(seq 1 90); do
            if docker compose --env-file .env logs web 2>/dev/null | grep -q 'TAP-ABORT:'; then
              echo "::error::boot aborted (TAP-ABORT sentinel in web log)"
              docker compose --env-file .env logs web; exit 1
            fi
            if docker compose --env-file .env exec -T web sh -c 'cd /app && uv run python manage.py health --set readiness' >/dev/null 2>&1; then
              echo "web healthy after ~$((i * 10))s"; ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::web did not become healthy within the timeout"
            docker compose --env-file .env logs web | tail -150; exit 1
          fi

      # The plugin ships its tests inside the package (tap_plugin/<slug>/tests/), so
      # collect them by import path — travels with the plugin, no path knowledge needed.
      - name: Run the plugin's in-package tests
        env:
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        run: |
          set -o pipefail
          docker compose --env-file .env exec -T web sh -c \
            "cd /app && uv run pytest -p no:cacheprovider --pyargs tap_plugin.$PLUGIN_SLUG" | tee pytest.log

      # The summary is the evidence (req-tap-plugin-extdev-repo-ci-8): the core this ran
      # against, the plugin commit, and how many tests EXECUTED. Zero is red — a green
      # with nothing run is presence-is-not-correctness in lane form (a wrong --pyargs,
      # a package that ships no tests, a collection error swallowed by the shell).
      - name: Summary (fails on zero executed tests)
        if: always()
        env:
          HARNESS_SHA: ${{ needs.conformance.outputs.harness_sha }}
          HARNESS_SOURCE: ${{ needs.conformance.outputs.harness_source }}
          HARNESS_FLOOR: ${{ needs.conformance.outputs.harness_floor }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        run: |
          plugin_sha=$(git -C "_dev-plugins/$PLUGIN_SLUG" rev-parse HEAD)
          executed=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("pytest.log").read_text(errors="replace") if pathlib.Path("pytest.log").is_file() else ""
          tail = text[-4000:]
          counts = {k: int(v) for v, k in re.findall(r"(\d+) (passed|failed|error|errors|xfailed|xpassed)", tail)}
          print(counts.get("passed", 0) + counts.get("failed", 0) + counts.get("error", 0) + counts.get("errors", 0) + counts.get("xfailed", 0) + counts.get("xpassed", 0))
          PY
          )
          {
            echo "### boot-and-test — $PLUGIN_SLUG"
            echo "| what | value |"
            echo "| --- | --- |"
            echo "| core harness | \`$HARNESS_SHA\` (${HARNESS_SOURCE}${HARNESS_FLOOR:+, floor $HARNESS_FLOOR}) |"
            echo "| plugin | \`$plugin_sha\` |"
            echo "| tests executed | $executed |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$executed" = "0" ]; then
            echo "::error::boot-and-test executed 0 tests for tap_plugin.$PLUGIN_SLUG — a green with nothing run is not a green (req-tap-plugin-extdev-repo-ci-8)"
            exit 1
          fi

      - name: Dump web logs on failure
        if: failure()
        run: docker compose --env-file .env logs web | tail -200
