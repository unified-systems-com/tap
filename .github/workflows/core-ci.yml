# core_ci validation, defined ONCE (req-dev-validation-product-line-lanes-8, -11; tap#638).
#
# Two lanes over `boot/core_ci.boot.json` (core + the fixture plugins, no product):
#   line       boots core_ci and runs the core walk + each fixture plugin's suite by owner
#              through tap.lane_run, with the Gryphon corpus required to execute;
#   cold-boot  boots core_ci and runs scripts/gate (fresh scratch-DB boot cycle).
#
# Callers, and why this is one file: product-lines.yml runs both on every PR (tier-gated
# there, where the tier is known), and publish-release-tags.yml runs both on the exact tag
# commit before a version is promoted. A tap release gates on core only — never on a
# product or the test_all union (ruling George 2026-09-19, restated 2026-09-25). Two
# copies of these job bodies would drift; the release would then be gated on something
# other than what every PR was gated on.
#
# `lane` selects ONE job per call, so each caller keeps a separate result per lane (the
# `gate` aggregator reads `line` and `cold-boot` separately, with different skip rules).
# An unknown value fails in `lane-check` rather than skipping both jobs: a reusable-workflow
# call whose every job skipped reports success, which would be a false green.

name: core-ci

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit / tag to validate (default: the caller's commit, github.sha)."
        required: false
        type: string
        default: ""
      lane:
        description: "Which lane this call runs: 'line' or 'cold-boot'."
        required: true
        type: string

permissions:
  contents: read

jobs:
  lane-check:
    if: inputs.lane != 'line' && inputs.lane != 'cold-boot'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse an unknown lane
        env:
          LANE: ${{ inputs.lane }}
        run: |
          echo "::error::core-ci.yml: unknown lane '${LANE}' (expected 'line' or 'cold-boot')"
          exit 1

  line:
    name: core_ci line
    if: inputs.lane == 'line'
    # Free GitHub-hosted runner (4 vCPU) — measured at ~9 min for the identical job
    # vs ~7 min on the retired 8-vCPU CodeBuild runner (see product-lines.yml header RUNNER HISTORY).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      # Name of the per-worker clone-source template built below (in-container).
      TAP_TEST_DB_TEMPLATE: tap_test_template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # The workspace is bind-mounted into the web container, where plugin tests run;
          # a persisted GITHUB_TOKEN in .git would be readable there. Nothing after this
          # step needs git credentials. Same setting as the cold-boot job below.
          persist-credentials: false

      - name: Provide empty secrets root
        run: |
          rm -f tap_secrets
          mkdir -p tap_secrets

      - name: Point the uv cache at an out-of-tree dir (runner temp)
        # $RUNNER_TEMP is outside the workspace, so the container's `.:/app` mount
        # never sweeps the persisted cache into the scanned repo tree (the
        # secret-pattern guard walks /app). Set via $GITHUB_ENV in a run step, NOT a
        # job-level `env:` — the `runner` context is unavailable at job level, and
        # referencing it there is an invalid-workflow error (no jobs even schedule).
        run: echo "TAP_CI_UV_CACHE=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"

      # The lane writes into the bind-mounted checkout (boot record, pytest caches, lane
      # summary) and into the uv-cache host bind. On Linux those writes are refused unless
      # the container uid owns the path — and THIS lane builds the image when the Dockerfile
      # inputs change (.github/actions/ci-web-image is pull-first, build-fallback), so it is
      # running the image that declares `USER nonroot`. Compose defaults the override to
      # EMPTY on purpose, so stacks pulling the older published image still work; a lane on a
      # freshly-built image has to opt in. See req-tap-serving-unprivileged.
      - name: Align the container uid with the runner (built image runs as nonroot)
        run: |
          # Fail closed if the runner is uid 0. Compose `user:` overrides the image
          # USER, so TAP_USER=0:0 would hand the web container back the root this
          # PR removes — and these lanes call compose directly, not through
          # scripts/dc, so its refusal never sees them. GitHub-hosted ubuntu-*
          # runners are uid 1001 (verified), but that is a property of the runner
          # image, not of this file. Raised by the Grok seat on PR# 759 - tap.
          uid="$(id -u)"
          if [ "$uid" -eq 0 ]; then
            echo "::error::Runner is uid 0; TAP_USER=0:0 would defeat the non-root image. Refusing."
            exit 1
          fi
          echo "TAP_USER=$uid:0" >> "$GITHUB_ENV"

      - name: Provide web image (pull published when inputs unchanged, else build)
        uses: ./.github/actions/ci-web-image

      - name: Restore uv cache (wheels + plugin git-installs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-ci-core_ci-${{ hashFiles('uv.lock', 'pyproject.toml', 'boot/*.boot.json', '**/boot/*.boot.json') }}
          restore-keys: |
            uv-ci-core_ci-
            uv-ci-
      # Boot THIS line's profile (preboot installs exactly that profile's plugins).
      - name: Boot the core_ci profile
        env:
          TAP_BOOT_PROFILE: core_ci
          TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE: "false"
        run: |
          docker compose --env-file .env up -d
          ok=0
          for i in $(seq 1 300); do
            if docker compose --env-file .env logs web 2>/dev/null | grep -q 'TAP-ABORT:'; then
              echo "::error::boot aborted (TAP-ABORT sentinel in web log)"
              docker compose --env-file .env logs web; exit 1
            fi
            if docker compose --env-file .env exec -T web sh -c 'cd /app && uv run python manage.py health --set readiness' >/dev/null 2>&1; then
              echo "web healthy after ~$((i * 3))s"; ok=1; break
            fi
            # 3s, not 10: readiness lands mid-interval, so the poll step is pure
            # quantization waste — same total timeout via the higher loop bound.
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "::error::web did not become healthy within the timeout"
            docker compose --env-file .env logs web | tail -150; exit 1
          fi

      # Build the per-profile template DB workers clone from. Honors the booted profile's
      # installed app set (entry-point discovery), so the template schema matches the run.
      - name: Build per-profile test-DB template
        run: docker compose --env-file .env exec -T web sh -c 'cd /app && TAP_TEST_DB_TEMPLATE=tap_test_template scripts/build-test-template'

      # This line's tests. install-aware collection (req-dev-validation-collection-complete)
      # runs core + the booted profile's plugin tests. Worker DBs clone the template.
      # `--require` makes a named suite's execution part of the verdict: on
      # core_ci that is the Gryphon corpus, which a collect-then-skip would otherwise pass.
      - name: Test lane — core_ci
        # -n auto: workers == cores. Measured on the 4-vCPU free runner (tmpfs pg,
        # so the lane is CPU-bound): -n 4 = 233s, -n 6 = 243s, -n 8 = 256s — and
        # auto keeps tracking the runner size if GitHub resizes it again.
        run: |
          docker compose --env-file .env exec -T web sh -c '
            set -euo pipefail
            cd /app
            uv run python -m tap.plugin_testing --record boot/core_ci.boot.json --check --plan
            require="gryphon_playground"
            TAP_TEST_DB_TEMPLATE=tap_test_template uv run python -m tap.lane_run \
              --root /app --record boot/core_ci.boot.json ${require:+--require "$require"} \
              --summary /app/lane-summary.md -- -n auto
          '
          docker compose --env-file .env exec -T web cat /app/lane-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Dump web logs on failure
        if: failure()
        run: docker compose --env-file .env logs web | tail -200
      - name: Make uv cache saveable (container wrote it as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/uv-cache" 2>/dev/null || true

  cold-boot:
    # Boots `core_ci` (core + the fixture plugins) and runs scripts/gate over it. The
    # tier rules (which diffs run it, which may skip it) live with the caller.
    name: core_ci cold-boot
    if: inputs.lane == 'cold-boot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      # scripts/gate's cold_boot_gate reads this as its --profile default (seed:boot-profile).
      TAP_BOOT_PROFILE: core_ci
      TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Provide empty secrets root
        run: |
          rm -f tap_secrets
          mkdir -p tap_secrets
      - name: Point the uv cache at an out-of-tree dir (runner temp)
        # See the `line` job above: $RUNNER_TEMP is outside the workspace (out of the
        # scanned /app tree); set via $GITHUB_ENV, not job-level `env:`, because the
        # `runner` context is unavailable at job level.
        run: echo "TAP_CI_UV_CACHE=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
      # The lane writes into the bind-mounted checkout (boot record, pytest caches, lane
      # summary) and into the uv-cache host bind. On Linux those writes are refused unless
      # the container uid owns the path — and THIS lane builds the image when the Dockerfile
      # inputs change (.github/actions/ci-web-image is pull-first, build-fallback), so it is
      # running the image that declares `USER nonroot`. Compose defaults the override to
      # EMPTY on purpose, so stacks pulling the older published image still work; a lane on a
      # freshly-built image has to opt in. See req-tap-serving-unprivileged.
      - name: Align the container uid with the runner (built image runs as nonroot)
        run: |
          # Fail closed if the runner is uid 0. Compose `user:` overrides the image
          # USER, so TAP_USER=0:0 would hand the web container back the root this
          # PR removes — and these lanes call compose directly, not through
          # scripts/dc, so its refusal never sees them. GitHub-hosted ubuntu-*
          # runners are uid 1001 (verified), but that is a property of the runner
          # image, not of this file. Raised by the Grok seat on PR# 759 - tap.
          uid="$(id -u)"
          if [ "$uid" -eq 0 ]; then
            echo "::error::Runner is uid 0; TAP_USER=0:0 would defeat the non-root image. Refusing."
            exit 1
          fi
          echo "TAP_USER=$uid:0" >> "$GITHUB_ENV"

      - name: Provide web image (pull published when inputs unchanged, else build)
        uses: ./.github/actions/ci-web-image
      - name: Restore uv cache (wheels + plugin git-installs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-ci-core_ci-${{ hashFiles('uv.lock', 'pyproject.toml', 'boot/*.boot.json', '**/boot/*.boot.json') }}
          restore-keys: |
            uv-ci-core_ci-
            uv-ci-
      - name: Boot the core_ci profile
        run: |
          docker compose --env-file .env up -d
          ok=0
          for i in $(seq 1 300); do
            if docker compose --env-file .env logs web 2>/dev/null | grep -q 'TAP-ABORT:'; then
              echo "::error::boot aborted (TAP-ABORT sentinel in web log)"
              docker compose --env-file .env logs web; exit 1
            fi
            if docker compose --env-file .env exec -T web sh -c 'cd /app && uv run python manage.py health --set readiness' >/dev/null 2>&1; then
              echo "web healthy after ~$((i * 3))s"; ok=1; break
            fi
            # 3s, not 10: readiness lands mid-interval, so the poll step is pure
            # quantization waste — same total timeout via the higher loop bound.
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "::error::web did not become healthy within the timeout"
            docker compose --env-file .env logs web | tail -150; exit 1
          fi
      - name: Cold-boot gate (scripts/gate — fresh scratch-DB boot cycle)
        run: scripts/gate
      - name: Dump web logs on failure
        if: failure()
        run: docker compose --env-file .env logs web | tail -200
      - name: Make uv cache saveable (container wrote it as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/uv-cache" 2>/dev/null || true
