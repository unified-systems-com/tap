# One-off trial of Renovate's forking mode against a single plugin repo.
#
# The production Renovate job (renovate.yml) authenticates as the tap-renovate GitHub App, which
# holds Contents/Workflows write on the repos it serves. Forking mode is the write-less
# alternative: Renovate runs as the tap-renovate-helper machine account, which is NOT a member of
# the org and has no role on any of our repos. It forks the target repo into its own account,
# pushes the update branch there, and opens a PR from the fork, exactly as an outside contributor
# would. Our rulesets then treat that PR like any fork PR: CI runs, a human approves, a human merges.
#
# What this trial answers:
#   1. Does a PR arrive from the bot's fork?
#   2. Do the target repo's CI and AI review run on it?
#
# Deliberately narrow: hand-triggered only, one repo, at most one open PR per run, no
# dependency-dashboard issue. The PR limits cap a run, not the file's lifetime, so the job also
# refuses to start after a fixed date: the trial cannot quietly become a standing credential path.
# RENOVATE_FORK_TOKEN is a classic token on tap-renovate-helper (public_repo + workflow, expiring).
# It is passed as both the platform token and forkToken, which is what forking mode expects.
# Delete this file once the trial has reported; the fleet decision is separate (Q25).
name: renovate-fork-trial

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level (debug for troubleshooting)"
        required: false
        default: "info"
        type: choice
        options: [info, debug]

permissions:
  contents: read

concurrency:
  group: renovate-fork-trial

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse after the trial window
        # Runs before the token is handed to anything. Delete this workflow rather than moving
        # the date; a real rollout is a separate decision with its own review.
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261003 ]; then
            echo "::error::renovate-fork-trial expired on 2026-10-03; delete this workflow"
            exit 1
          fi
      - name: Run Renovate in forking mode
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          token: ${{ secrets.RENOVATE_FORK_TOKEN }}
          # The action runs a Renovate container that receives the PAT. Its default is the
          # mutable major tag `44`, so pin the image by digest: a retag cannot swap the code
          # that holds the token. Resolved from ghcr.io/renovatebot/renovate:44 on 2026-09-26.
          renovate-version: 44@sha256:e262ed52b23dd8c545c80faf5b1ad5c95a07b3f198888de8d7b8928f45c307c7
        env:
          RENOVATE_FORK_TOKEN: ${{ secrets.RENOVATE_FORK_TOKEN }}
          RENOVATE_REPOSITORIES: unified-systems-com/tap-plugin-github-core
          RENOVATE_ONBOARDING: "false"
          # github-core has no renovate.json yet; run on defaults for the trial.
          RENOVATE_REQUIRE_CONFIG: "optional"
          RENOVATE_PR_CONCURRENT_LIMIT: "1"
          RENOVATE_PR_HOURLY_LIMIT: "1"
          RENOVATE_DEPENDENCY_DASHBOARD: "false"
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
