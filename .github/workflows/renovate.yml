# Self-hosted Renovate (req-cicd-base-image-lifecycle-1 / req-cicd-dep-automation).
#
# Why self-hosted (GHA cron) and not the Mend-hosted app: repo-write stays
# in-house — the only identity that can push branches/PRs here is our own
# org-owned GitHub App, whose permissions we mint and whose key we rotate.
#
# Credential (manage-secret reviewed, 2026-08-09): the `tap-renovate` GitHub App —
# consumer-scoped to CI dependency automation. Least privilege: Repository
# Contents RW + Pull requests RW + Workflows RW (action-version bumps edit
# workflow files) + Issues RW (the dependency dashboard) + Checks/Statuses R;
# installed on unified-systems-com/tap only. Rotation: re-mint the key in the
# App's settings, update the RENOVATE_APP_PRIVATE_KEY repo secret; no restart
# semantics (next cron picks it up). The PEM shape is covered by the in-repo
# credential scanner (tap/credential_patterns.py PEM armor pattern), and the
# key itself lives ONLY as a GitHub Actions secret — never in the tree, never
# in the tap-cares store (it is CI infrastructure, not TAP runtime).
#
# Renovate reads its behavior config from renovate.json5 at the repo root.
# PR-only: automerge is off there; PRs run the normal pull_request gate and the
# `main-required-checks` ruleset makes a green `gate` a server-side merge
# precondition. The end-to-end loop this automates: Chainguard/base patch →
# Renovate PR → test_all green → merge → publish-images ships → Trivy confirms.
name: renovate

on:
  schedule:
    - cron: "45 5 * * *"   # daily 05:45 UTC — ahead of the 09:30 trivy-nightly sweep
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level (debug for troubleshooting)"
        required: false
        default: "info"
        type: choice
        options: [info, debug]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - name: Run Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          token: ${{ steps.app.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: unified-systems-com/tap
          # renovate.json5 is committed; no onboarding PR dance.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
