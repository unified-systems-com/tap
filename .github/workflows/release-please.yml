# Core release lane (req-cicd-product-releases-1, spec-cicd-hardening.md).
#
# release-please watches main's conventional commits and maintains ONE rolling
# release PR (version bump in pyproject.toml + generated CHANGELOG.md). Merging
# that PR — through the same required-checks gate as everything else — is the
# human act that cuts a release: the action then creates the vX.Y.Z tag and the
# GitHub Release with the changelog as its notes. The tag push triggers
# publish-release-tags.yml, which promotes the already-attested image bytes to
# their versioned tags. Nothing releases without a maintainer merging the PR.
#
# Pre-1.0 version mapping (release-please-config.json): BREAKING → minor
# (0.1.x → 0.2.0), feat/fix → patch (0.1.0 → 0.1.1). This is the contract
# language in the Sam letter addendum: "0.1.x warns, 0.2.0 enforces".
#
# IDENTITY (load-bearing): all writes ride the org-owned `tap-release-please` GitHub
# App (same trust model as Renovate) — the workflow mints a ~1h installation
# token per run from vars.TAP_RELEASE_PLEASE_APP_ID + secrets.TAP_RELEASE_PLEASE_APP_PRIVATE_KEY.
# App permissions: Contents + Pull requests (read/write), installed on this
# repo only. Both jobs run with a read-scoped GITHUB_TOKEN by design
# (req-cicd-runner-least-privilege: no third-party step shares a write-scoped
# job token), and PRs/pushes made with the app token DO trigger the required
# checks (a default-token PR would sit checkless and unmergeable forever).
# App keys don't expire; if the key is ever rotated, update the secret —
# failure symptom is this workflow failing loudly at the token-mint step.
#
# The lock-refresh job exists because uv.lock records core's OWN version
# ([[package]] name = "tap"): a version-only pyproject bump invalidates the
# lock (`uv lock --check` fails), which would red the frozen image build on
# the release PR itself. Verified 2026-08-10.

name: release-please

on:
  push:
    branches: [main]

permissions: {}

# One release PR, updated serially; never cancel a run that may be mid-tag.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only job token: every write (release PR, tag, Release) rides the
    # minted app token, never the workflow token.
    permissions:
      contents: read
    outputs:
      prs_created: ${{ steps.rp.outputs.prs_created }}
      prs: ${{ steps.rp.outputs.prs }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.TAP_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.TAP_RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Keep uv.lock coherent INSIDE the release PR (see header). Read-scoped job:
  # the checkout keeps no credentials and the push authenticates explicitly
  # with a freshly minted app token, exposed only to the steps that need it —
  # the third-party setup-uv step never sees a write credential. The lock
  # commit authors as github-actions[bot]; release-please's own commits author
  # as tap-release-please[bot] — both DCO-exempt (scripts/check-dco BOT_AUTHOR_RE).
  lock-refresh:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.prs)[0].headBranchName }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Check whether the lock needs a refresh
        id: lockdiff
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "uv.lock already coherent — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: steps.lockdiff.outputs.changed == 'true'
        id: app-token
        with:
          app-id: ${{ vars.TAP_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.TAP_RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - name: Push the refreshed lock onto the release PR
        if: steps.lockdiff.outputs.changed == 'true'
        env:
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ fromJSON(needs.release-please.outputs.prs)[0].headBranchName }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(release): refresh uv.lock for the bumped core version"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_BRANCH}"
