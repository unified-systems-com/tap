{% load static %}

{% if graph_error %}
<div class="rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
    {{ graph_error }}
</div>
{% else %}

<div id="tap-graph-container-{{ graph_context_id }}"
     class="relative w-full border border-slate-200 rounded-lg"
     style="height: 280px;"
     data-placement="{{ graph_placement }}">
    <div id="tap-graph-{{ graph_context_id }}" class="w-full h-full overflow-hidden rounded-lg"></div>
</div>

{{ graph_nodes|json_script:graph_nodes_script_id }}
{{ graph_edges|json_script:graph_edges_script_id }}

<script>
(function () {
    var contextId = "{{ graph_context_id }}";
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () { initGraph(contextId); });
    } else {
        initGraph(contextId);
    }
})();
</script>

{% endif %}
