# validation_sample — a minimal, self-contained fixture plugin.
#
# It exists ONLY as a permanent target for the tap_plugins validate_plugin test
# suite (test_validate_service.py / test_validate_cli.py / test_validate_mgmt.py).
# The monorepo evicted every real plugin to its own repo, so those tests need a
# real, installable, package-mode plugin they can validate at all three levels
# (structure / loads / runs) without depending on an evicted repo.
#
# Deliberately tiny: one BaseModel, one wildcard edge, one no-op collector. Static
# version (no hatch-vcs) — a test fixture needs no VCS-derived version. The identity
# chain (slug / namespace / distribution / entry-point) is exact so the validator's
# identity-coherence check passes: slug=validation_sample, namespace
# tap_plugin.validation_sample, distribution tap-plugin-validation-sample.
[project]
name = "tap-plugin-validation-sample"
version = "0.0.1"
description = "Minimal self-contained fixture plugin — the validate_plugin test suite's permanent target."
requires-python = ">=3.14"
dependencies = []

# The tap.plugins entry point: exactly one key equal to the slug, pointing at the
# AppConfig under the namespace package (req-tap-plugin-arch-identity). Entry-point
# discovery (tap.preboot.discover_entry_points) loads this as an INSTALLED_APP under
# pytest, so the model registers and its table migrates into the test DB.
[project.entry-points."tap.plugins"]
validation_sample = "tap_plugin.validation_sample.apps:ValidationSampleConfig"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/validation_sample"]
