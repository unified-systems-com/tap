# CI-only compose overlay — used by the server-side test lanes
# (.github/workflows/all-plugins.yml and product-lines.yml), activated via
# COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml in the job env.
#
# The workflow builds the web image with docker/build-push-action + a GitHub Actions
# layer cache (cache-from/to type=gha) and loads it locally as `tap-web:ci`. This
# overlay points the web service at that pre-built tag so `docker compose up` reuses
# it instead of rebuilding the whole image from scratch on every run.
#
# The dev docker-compose.yml is deliberately left untouched: `type=gha` only resolves
# inside the Actions runner, so it must never leak into the local dev stack. Keeping
# the cache wiring in this overlay (and in the workflow) isolates it to CI.
services:
  web:
    image: tap-web:ci
    # The image is always pre-loaded by the pull-or-build step; never reach out
    # to a registry from compose itself.
    pull_policy: never
    volumes:
      # CI-only: swap the base file's `uv_cache` NAMED volume for a host bind so
      # actions/cache can persist wheels + plugin git checkouts across runs
      # (compose merges service volumes by mount target — this entry overrides).
      # An empty restored-miss dir behaves exactly like a fresh named volume:
      # the entrypoint seeds it from the image's /opt/uv-cache-seed. The default
      # keeps a bare `docker compose config` (no env) valid outside CI.
      - ${TAP_CI_UV_CACHE:-uv_cache}:/root/.cache/uv
    # CI-only: pass the secret-source preinstall list + the lane's ambient AWS role creds
    # into the container so the boot's secret-source seam can reach AWS Secrets Manager for
    # a plugin-pull credential (the samsite lane). The lane exports the CodeBuild role's
    # temporary creds as STATIC AWS_ACCESS_KEY_ID/.../SESSION_TOKEN — this sidesteps the
    # docker-in-docker credential-endpoint reachability problem (a nested container may not
    # reach 169.254.170.2). All default empty, so this overlay is a no-op for test_all and
    # for local use (which never set these).
    environment:
      TAP_SECRET_SOURCE_DISTS: ${TAP_SECRET_SOURCE_DISTS:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}

  # CI-only Postgres tuning. This database is created fresh and thrown away after the
  # run, so trade every durability guarantee for throughput. The test lane is Postgres-
  # I/O-bound (each xdist worker clones a migrated template DB and hammers it), so the
  # single biggest speedup available is to (a) disable fsync / synchronous_commit /
  # full_page_writes and (b) put the data directory on a tmpfs (RAM). NEVER use this in
  # any environment whose data must survive a restart — a crash loses the whole cluster.
  #
  # PGDATA is pointed at the tmpfs mount rather than the base named volume: the base
  # `postgres_data` volume stays mounted at .../data (harmless, unused), which avoids a
  # duplicate-mountpoint conflict while keeping this overlay purely additive.
  db:
    # CI rides :latest, NOT the .env version pin. The pin is a CONSUMER contract
    # (known, attested release bytes); CI's contract is this branch's code against
    # main-tip infrastructure — and a release PR makes the pin structurally
    # unsatisfiable in CI: its whole content is bumping TAP_VERSION to a version
    # whose images only get minted AFTER the merge (the 0.1.3 release PR gated
    # red on exactly this once the base compose went pull-only). Mirrors the web
    # half (tap-web:ci) and dev sessions (.env.local :latest). Known, pre-existing
    # gap this does NOT change: a PR editing docker/postgres/Dockerfile is not
    # exercised by CI either way (the db image is never built from the PR tree).
    image: ghcr.io/unified-systems-com/tap-db:latest
    command:
      - "postgres"
      - "-c"
      - "max_locks_per_transaction=512"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
    environment:
      PGDATA: /var/lib/postgresql/tmpdata
    tmpfs:
      - /var/lib/postgresql/tmpdata:size=4g
