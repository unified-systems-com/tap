{% load static %}
<div class="tw-batch">

  {# At-a-glance roster counts. #}
  <div class="tw-band">
    <span class="tw-band-label">Batches</span>
    <span class="tw-pill tw-pill-neutral">{{ counts.total }} total</span>
    <span class="tw-pill tw-pill-ok">{{ counts.closed }} closed</span>
    <span class="tw-pill tw-pill-muted">{{ counts.open }} open</span>
    {% if counts.failed %}<span class="tw-pill tw-pill-bad">{{ counts.failed }} failed</span>{% endif %}
  </div>

  <section class="tw-card">
    <div class="tw-card-head">
      <h3>All Batches ({{ counts.total }})</h3>
      <input type="search" id="tap-table-filter-{{ panel.entity_id }}-batches" data-tap-table-filter placeholder="Filter batches…" aria-label="Filter batches" class="tw-filter">
    </div>
    <div data-tap-table-mount data-tap-table-panel-id="{{ panel.entity_id }}-batches" data-tap-table-mode="raw" id="tap-table-mount-{{ panel.entity_id }}-batches" class="tap-table-container"></div>
    {{ rows|json_script:rows_script_id }}
    <script type="application/json" id="tap-table-columns-{{ panel.entity_id }}-batches">[
      {"field": "name", "title": "Batch", "widthGrow": 3, "tooltip": "full_value"},
      {"field": "source", "title": "Source", "widthGrow": 2, "tooltip": "full_value"},
      {"field": "status", "title": "Status", "width": 110},
      {"field": "started_at", "title": "Started", "formatter": "datetime", "width": 165},
      {"field": "closed_at", "title": "Closed", "formatter": "datetime", "width": 165}
    ]</script>
  </section>

</div>
