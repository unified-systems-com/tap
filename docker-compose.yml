# TAP Development Docker Compose Configuration
# This file defines all the services needed to run TAP locally

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    # Minimal Wolfi + PostgreSQL 16.14 + the self-built OpenSSL 3.0.9 FIPS provider
    # (req-cicd-base-image-lifecycle-3/-5/-6), replacing the outgoing postgres:16-alpine.
    # A drop-in via postgresql-16-oci-entrypoint (same POSTGRES_* contract) at the exact same
    # 16.14. TAP_FIPS selects the FIPS variant (default 1; TAP_FIPS=0 escape hatch), mirroring
    # the web image. See docker/postgres/Dockerfile.
    # ⚠️ The cluster is initdb'd with --locale=C (baked in the image) to reproduce the outgoing
    # musl cluster's actual C sort order on glibc Wolfi and dodge glibc-upgrade index
    # invalidation (doc-fips-assessment-record.md §5.4). datcollate is baked at initdb, so the
    # data volume MUST be recreated on cutover (dev: `scripts/dc down -v`).
    # Published multi-arch image (publish-images.yml, anonymous pull). PULL-ONLY
    # here on purpose: a missing pinned tag hard-fails `up` instead of silently
    # building an unattested substitute. Local rebuilds are explicit via
    # `scripts/dc build db` (docker-compose.build.yml overlay; the result
    # shadows the published tag on this host until the next `scripts/dc pull db`).
    image: ${TAP_DB_IMAGE:?TAP_DB_IMAGE unset — .env defines it from TAP_VERSION; see .env}

    # Raise the lock table for parallel test runs. Each pytest-xdist worker's
    # transaction=True flush TRUNCATEs the full table set (~247 tables → one
    # AccessExclusiveLock each); the default max_locks_per_transaction=64
    # (× max_connections=100 ≈ a 6,400-slot shared pool) is exhausted when N
    # workers truncate concurrently, surfacing as
    # "out of shared memory / increase max_locks_per_transaction" flush errors.
    # 512 gives a ~51k-slot pool — ample headroom for `-n auto`. Test/dev infra
    # only; the extra shared memory is negligible.
    # (req-dev-validation-suite-tiers; docs/misc/test-parallelization-xdist-notes.md)
    #
    # Local Tier-0 throughput tuning (the disk-safe subset of docker-compose.ci.yml's
    # override). The dev/test cluster holds only reproducible data, so trade durability
    # for speed: fsync/synchronous_commit/full_page_writes off eliminates the per-commit
    # sync that dominates the Postgres-I/O-bound test lane (the full lane is ~95%
    # DB-bound). Unlike CI we do NOT put PGDATA on tmpfs — the persistent `postgres_data`
    # volume is kept, so your data survives a CLEAN restart. The only cost: an UNCLEAN
    # shutdown (power loss, OOM/kill -9 of postgres) can corrupt the cluster — rebuild
    # with `scripts/dc down -v` + re-seed. CI fully replaces this command (with tmpfs),
    # so this base tuning affects local stacks only. Takes effect on the next db
    # container recreate (`scripts/dc up -d`).
    command:
      - "postgres"
      - "-c"
      - "max_locks_per_transaction=512"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"

    # Persist database data between container restarts
    # Without this, your data disappears when the container stops
    #
    # This uses a NAMED VOLUME (postgres_data), not a local directory.
    # Docker manages where the data actually lives on your Mac.
    # Named volumes are preferred for databases because:
    #   - Better I/O performance than bind mounts on Mac
    #   - Docker handles Linux/Mac filesystem translation
    #   - Portable across operating systems
    #
    # Compare to the 'web' service below which uses a BIND MOUNT (.:/app)
    # to map your local code directory into the container for hot-reload.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Database configuration via environment variables
    # In production, these would come from secrets management
    environment:
      POSTGRES_DB: tap          # Name of the database to create
      POSTGRES_USER: tap        # Database username
      POSTGRES_PASSWORD: tap    # Database password (change in production!)

    # Expose PostgreSQL port to the host machine
    # Useful for connecting with database tools like pgAdmin or DBeaver
    #
    # Host port is parameterized to support multiple concurrent dev sessions
    # (see spec-dev-multisession.md). Container port stays fixed at 5432.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    # Health check to verify database is ready to accept connections
    # Other services can wait for this before starting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tap -d tap"]
      interval: 5s      # Check every 5 seconds
      timeout: 5s       # Fail if check takes longer than 5 seconds
      retries: 5        # Give up after 5 failures

  # ============================================================================
  # Django Web Application
  # ============================================================================
  web:
    # Published multi-arch image (publish-images.yml, anonymous pull) carrying the
    # pre-compiled wheel cache. PULL-ONLY here on purpose (same rationale as db).
    # Local rebuilds are explicit via `scripts/dc build web` (docker-compose.build.yml
    # overlay; same tag-shadowing note as db above). TAP_FIPS build-variant selection
    # (req-cicd-base-image-lifecycle-6) lives in that overlay; the image declares its
    # mode via the org.tap.fips label + TAP_FIPS_MODE env, and asserts it fail-closed
    # at boot (tap.fips, wired in docker/entrypoint.sh).
    image: ${TAP_WEB_IMAGE:?TAP_WEB_IMAGE unset — .env defines it from TAP_VERSION; see .env}

    # Mount the current directory into the container
    # This is a BIND MOUNT - your actual Mac directory mapped into the container.
    # Changes to code on your Mac appear immediately inside the container.
    # This is what enables hot-reload during development.
    #
    # Syntax: ./local/path:/container/path
    # The dot (.) means "current directory"
    #
    # venv is a NAMED VOLUME mounted over /app/.venv. The source tree is a
    # bind mount, but Python virtualenvs are OS-specific; sharing one .venv
    # between macOS host tools and the Linux container produces broken
    # interpreter links. Keeping the container venv in a per-project volume
    # isolates it from any host-side .venv or .venv-host.
    #
    # uv_cache is a NAMED VOLUME for uv's wheel/extract cache. Keeping it out
    # of the image means Docker's layer cache can't fossilize a corrupted uv
    # state into every rebuild (a real problem we hit while debugging multi-
    # session spawn). Each compose project gets its own volume, so sessions
    # are isolated; despawn's `dc down -v` removes it for free.
    volumes:
      - .:/app
      - venv:/app/.venv
      - uv_cache:/root/.cache/uv
      # tap-cares runtime secrets — bind-mounted from a gitignored host
      # directory the operator manages. Read-only inside the container; never
      # populated by the repo or by tests. Loader no-ops cleanly when the
      # directory is empty or missing. See tap_cares/specs/spec-tap-cares-secrets.md.
      - ./tap_secrets:/run/tap-secrets:ro
      # tailwindcss binary cache — populated by docker/install-tailwindcss.sh
      # on first invocation of the /tailwind-rebuild skill, reused thereafter.
      # Named volume rather than bind mount so the binary lives in Docker's
      # internal storage and never touches the host filesystem (deliberate —
      # host stays free of downloaded third-party executables). `dc down -v`
      # wipes the volume; next skill invocation re-downloads + re-verifies
      # against the manifest-pinned checksum. See
      # tap_web/specs/spec-web-tailwind-pipeline.md and
      # tap_grid/specs/spec-grid-security.md req-grid-thirdparty-manifest.sec-9/-10.
      - tailwind_bin:/opt/tailwind

    # Use the bind-mounted entrypoint so dev-time changes to startup plumbing
    # (including background workers) do not require rebuilding the image.
    entrypoint: ["/app/docker/entrypoint.sh"]

    # Map container port 8000 to host port WEB_PORT (default 8000)
    # Access the app at http://localhost:${WEB_PORT}
    #
    # Host port is parameterized to support multiple concurrent dev sessions
    # (see spec-dev-multisession.md). Container port stays fixed at 8000.
    ports:
      - "${WEB_PORT:-8000}:8000"

    # Environment variables for Django
    environment:
      # Database connection string
      # 'db' is the hostname - Docker networking resolves this to the db container
      DATABASE_URL: postgres://tap:tap@db:5432/tap

      # Django settings
      DEBUG: "true"                        # Enable debug mode (never in production!)
      SECRET_KEY: dev-secret-key-change-me # Django secret key (change in production!)
      # ALLOWED_HOSTS includes .localhost (note the leading dot) so any
      # *.localhost subdomain — e.g. cli.tap.localhost — is accepted. This
      # supports the multi-session dev URL convention without /etc/hosts edits.
      ALLOWED_HOSTS: localhost,127.0.0.1,.localhost

      # Multi-session label rendered in the UI title bar / browser tab so the
      # developer can tell at a glance which isolated stack a window points at.
      # Empty for the primary stack; set per-worktree in .env.local (e.g. "cli").
      # See specs/spec-dev-multisession.md.
      TAP_SESSION_LABEL: "${TAP_SESSION_LABEL:-}"

      # Unique identity for this TAP installation (UUIDv7, immutable)
      # Generated with: docker compose exec web uv run python manage.py generate_grid_id
      # Parameterized so each isolated session can carry its own install identity.
      TAP_GRID_ID: "${TAP_GRID_ID:-019c2a9a-cfdb-768e-82c5-7a037556064d}"

      # Product name shown in the UI title bar and header (default "RAMPART").
      # Override per-session in .env.local if a different brand is needed.
      TAP_PRODUCT_NAME: "${TAP_PRODUCT_NAME:-RAMPART}"

      # tap-cares runtime secrets root inside the container. Backed by the
      # ./tap_secrets:/run/tap-secrets:ro bind mount above. See
      # tap_cares/specs/spec-tap-cares-secrets.md.
      TAP_SECRETS_ROOT: /run/tap-secrets

      # Dev boot profile: which boot/<id>.json the `fire_boot_collectors`
      # command fires after seeding. Empty by default (no-op — boot collection
      # is never implicit); chosen explicitly per session via spawn's positional
      # boot-profile arg (or --boot <profile>), which writes it into .env.local.
      # See specs/spec-dev-boot-collectors.md.
      TAP_BOOT_PROFILE: "${TAP_BOOT_PROFILE:-}"

      # Pre-boot snapshot switch override (req-boot-snapshot / req-boot-variable-resolution).
      # A boot-variable whose env form is TAP_BOOT_<SECTION>__<KEY>; empty here means
      # "unset" so the profile field / default-true wins. spawn-session.sh writes
      # =false into a dev worktree's .env.local (dev DBs reset freely, so the
      # pre-migrate snapshot is pure overhead). Prod/customer standups leave it unset.
      TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE: "${TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE:-}"

      # Public base URL of this instance (req-tap-auth-providers-7). Used by auth
      # provider self-tests + boot validation to derive the OIDC callback URL.
      # allauth itself derives the runtime redirect_uri from the request. Empty
      # by default; set per-session in .env.local (e.g. http://localhost:8010).
      TAP_BASE_URL: "${TAP_BASE_URL:-}"
      # Passkey (WebAuthn) RP config (req-tap-auth-passkey-webauthn). RP-ID is the
      # registrable domain; the expected origin is EXACT (scheme+host+port). Dev binds
      # RP-ID=localhost and origin=http://localhost:<host WEB_PORT> — the browser hits
      # the host port, so the container must expect that exact origin.
      TAP_PASSKEY_RP_ID: "${TAP_PASSKEY_RP_ID:-localhost}"
      TAP_PASSKEY_ORIGIN: "${TAP_PASSKEY_ORIGIN:-http://localhost:${WEB_PORT:-8000}}"

    # Wait for the database to be healthy before starting Django
    # Prevents errors from Django trying to connect before PostgreSQL is ready
    depends_on:
      db:
        condition: service_healthy

    # Restart the container if it crashes
    # Useful during development when code errors might crash the server
    restart: unless-stopped

# ============================================================================
# Named Volumes
# ============================================================================
# Named volumes persist data and are managed by Docker
# Docker stores them internally (not in your project folder)
# Run 'docker volume ls' to see them; `scripts/dc down -v` removes the
# compose project's volumes during teardown.
volumes:
  postgres_data:  # Stores PostgreSQL data files
  venv:           # Stores the container-owned Python virtualenv at /app/.venv.
  uv_cache:       # Stores uv's downloaded wheels + extracted archives. Per-project.
  tailwind_bin:   # Stores the on-demand tailwindcss CLI binary at /opt/tailwind. Per-project.
